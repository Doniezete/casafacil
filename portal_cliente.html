<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Fácil — Portal do Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e1a;--s1:#111525;--s2:#171c30;--s3:#1e243c;--bd:#252d48;--bd2:#2e3855;
  --acc:#f59e0b;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;
  --purple:#8b5cf6;--orange:#f97316;--teal:#14b8a6;
  --tx:#e2e8f2;--tx2:#94a3b8;--tx3:#5a6785;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:14px}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  background-image:radial-gradient(ellipse at 25% 25%,rgba(245,158,11,.1) 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,rgba(59,130,246,.08) 0%,transparent 55%)}
.lw{width:100%;max-width:420px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px}
.l-logo{text-align:center}
.l-logo h1{font-family:var(--fh);font-size:2.4rem;font-weight:900;letter-spacing:-1.5px}
.l-logo h1 em{color:var(--acc);font-style:normal}
.l-logo p{font-size:.7rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1.8px;margin-top:4px}
.l-box{background:var(--s1);border:1px solid var(--bd2);border-radius:20px;padding:30px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.l-type{display:flex;gap:7px;margin-bottom:20px}
.ltb{flex:1;padding:9px;border-radius:8px;border:1px solid var(--bd2);background:var(--s2);color:var(--tx2);font-size:.79rem;font-weight:600;cursor:pointer;font-family:var(--fb);transition:all .15s;outline:none;-webkit-appearance:none}
.ltb.on{background:rgba(245,158,11,.12);border-color:var(--acc);color:var(--acc);pointer-events:auto}
.lf{margin-bottom:13px}
.lf label{display:block;font-size:.66rem;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.lf input{width:100%;background:var(--bg);border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:.88rem;font-family:var(--fb);transition:border-color .15s}
.lf input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
.l-btn{width:100%;padding:12px;background:var(--acc);color:#000;border:none;border-radius:9px;font-size:.92rem;font-weight:700;font-family:var(--fh);cursor:pointer;transition:filter .15s,transform .1s;margin-top:4px}
.l-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.l-err{color:#fca5a5;font-size:.78rem;text-align:center;margin-top:8px;display:none}
.l-hint{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:.76rem;color:var(--tx3);line-height:1.9;width:100%}
.l-hint strong{color:var(--acc)}
.l-hint .lh-title{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tx2);margin-bottom:5px}

/* APP */
.app{display:flex;min-height:100vh}
.sb{width:235px;background:var(--s1);border-right:1px solid var(--bd);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:50;overflow-y:auto}
.sb-logo{padding:20px 16px 14px;border-bottom:1px solid var(--bd)}
.sb-logo h1{font-family:var(--fh);font-size:1.2rem;font-weight:900;letter-spacing:-.5px}
.sb-logo h1 em{color:var(--acc);font-style:normal}
.sb-logo p{font-size:.58rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px;margin-top:2px}
.sb-user{padding:11px 14px;background:var(--s2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sb-av{width:35px;height:35px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:900;font-size:.88rem;color:#000;flex-shrink:0}
.sb-user-info .un{font-weight:600;font-size:.81rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.sb-user-info .ur{font-size:.65rem;color:var(--tx3)}
nav{flex:1;padding:9px 7px;display:flex;flex-direction:column;gap:1px}
.ng{font-size:.58rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px;padding:9px 9px 3px;font-weight:700}
.ni{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:.82rem;color:var(--tx2);transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:var(--fb);font-weight:500}
.ni:hover{background:var(--s2);color:var(--tx)}.ni.on{background:rgba(245,158,11,.12);color:var(--acc)}
.ni .ic{width:20px;text-align:center;flex-shrink:0;font-size:.95rem}
.sb-foot{padding:12px 14px;border-top:1px solid var(--bd)}
.sb-foot button{width:100%;padding:8px;border-radius:7px;background:none;border:1px solid var(--bd);color:var(--tx3);font-size:.76rem;cursor:pointer;font-family:var(--fb);transition:all .15s}
.sb-foot button:hover{border-color:var(--red);color:var(--red)}
.main{margin-left:235px;flex:1;padding:24px 28px;min-width:0}
.page{display:none}.page.on{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ph{margin-bottom:20px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ph h1{font-family:var(--fh);font-size:1.5rem;font-weight:900;letter-spacing:-.5px}
.ph p{color:var(--tx2);font-size:.81rem;margin-top:3px}

/* GRID / CARDS */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px}
.g{display:grid;gap:11px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.st{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:15px}
.st .l{font-size:.63rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.9px;font-weight:700;margin-bottom:5px}
.st .v{font-family:var(--fh);font-size:1.35rem;font-weight:900;line-height:1}
.st .s{font-size:.72rem;color:var(--tx2);margin-top:4px}
.c-g{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.05)}.c-g .v{color:var(--green)}
.c-r{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.04)}.c-r .v{color:var(--red)}
.c-b{border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.05)}.c-b .v{color:var(--blue)}
.c-a{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.05)}.c-a .v{color:var(--acc)}
.c-p{border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.05)}.c-p .v{color:var(--purple)}
.c-t{border-color:rgba(20,184,166,.3);background:rgba(20,184,166,.05)}.c-t .v{color:var(--teal)}

/* BADGES */
.bx{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap}
.bx-g{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#4ade80}
.bx-r{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.bx-b{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
.bx-y{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
.bx-gr{background:rgba(90,103,133,.12);border:1px solid rgba(90,103,133,.25);color:var(--tx2)}
.bx-p{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);color:#c4b5fd}

/* BUTTONS */
.btn{padding:8px 14px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:var(--fb);display:inline-flex;align-items:center;gap:5px}
.btn-a{background:var(--acc);color:#000}.btn-a:hover{filter:brightness(1.1)}
.btn-s{background:var(--s2);color:var(--tx);border:1px solid var(--bd2)}.btn-s:hover{border-color:var(--acc);color:var(--acc)}
.btn-g{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.3)}.btn-g:hover{background:var(--green);color:#000}
.btn-r{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25)}.btn-r:hover{background:var(--red);color:#fff}
.btn-b{background:rgba(59,130,246,.1);color:#93c5fd;border:1px solid rgba(59,130,246,.3)}.btn-b:hover{background:var(--blue);color:#fff}
.btn-p{background:rgba(139,92,246,.1);color:#c4b5fd;border:1px solid rgba(139,92,246,.3)}.btn-p:hover{background:var(--purple);color:#fff}
.btn-sm{padding:5px 10px;font-size:.73rem}
.btn-xs{padding:3px 8px;font-size:.68rem}

/* TABLES */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.81rem}
th{color:var(--tx3);font-weight:700;font-size:.63rem;text-transform:uppercase;letter-spacing:.8px;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap;text-align:left}
td{padding:10px 12px;border-bottom:1px solid rgba(37,45,72,.5);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.012)}

/* TABS */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 15px;font-size:.81rem;font-weight:600;cursor:pointer;border:none;background:none;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;font-family:var(--fb)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.tc{display:none}.tc.on{display:block}

/* ALERTS */
.al{border-radius:9px;padding:11px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px}
.al-y{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3)}
.al-b{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.2)}
.al-g{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2)}
.al-r{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2)}
.al .ai{font-size:1rem;flex-shrink:0;margin-top:2px}.al .at{font-weight:700;font-size:.82rem;margin-bottom:2px}.al .as{font-size:.76rem;color:var(--tx2)}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:14px;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:all}
.mo{background:var(--s1);border:1px solid var(--bd2);border-radius:16px;padding:24px;width:100%;max-width:700px;max-height:92vh;overflow-y:auto;transform:translateY(10px);transition:transform .2s}
.ov.on .mo{transform:translateY(0)}
.mo-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mo-h h2{font-family:var(--fh);font-size:1.05rem;font-weight:900}
.mo-h button{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:1rem;line-height:1;padding:4px}
.mo-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)}
.fr{display:grid;gap:10px;margin-bottom:12px}
.fr.c2{grid-template-columns:1fr 1fr}.fr.c3{grid-template-columns:1fr 1fr 1fr}
.fl label{display:block;font-size:.65rem;color:var(--tx3);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fl input,.fl select,.fl textarea{width:100%;background:var(--bg);border:1px solid var(--bd2);border-radius:8px;padding:8px 11px;color:var(--tx);font-size:.85rem;font-family:var(--fb);transition:border-color .15s}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:none;border-color:var(--acc)}
.fl select option{background:var(--s2)}
.fl textarea{resize:vertical;min-height:70px}

/* PROGRESS */
.pw{margin-bottom:16px}
.ph2{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.pl{font-weight:600;font-size:.84rem}
.pp{font-family:var(--fh);font-weight:900;font-size:.88rem}
.pt{background:var(--s3);border-radius:5px;height:9px;overflow:hidden}
.pf{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.ps{font-size:.71rem;color:var(--tx3);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}

/* TIMELINE */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--bd2)}
.tli{position:relative;margin-bottom:16px}
.tld{position:absolute;left:-20px;top:5px;width:13px;height:13px;border-radius:50%;border:2px solid var(--bd);background:var(--s2)}
.tld.done{background:var(--green);border-color:var(--green)}
.tld.active{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
.tl-date{font-size:.68rem;color:var(--tx3);margin-bottom:2px}
.tl-title{font-weight:600;font-size:.83rem;margin-bottom:2px}
.tl-desc{font-size:.77rem;color:var(--tx2)}

/* ACCORDION */
.ac{background:var(--s1);border:1px solid var(--bd);border-radius:11px;overflow:hidden;margin-bottom:11px}
.ac-h{padding:14px 16px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:background .15s;user-select:none}
.ac-h:hover{background:var(--s2)}
.ac-ic{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;background:var(--s3)}
.ac-ic.done{background:rgba(34,197,94,.15)}.ac-ic.active{background:rgba(245,158,11,.15)}
.ac-cv{color:var(--tx3);font-size:.75rem;margin-left:auto;transition:transform .2s}
.ac-cv.open{transform:rotate(180deg)}
.ac-b{display:none;padding:0 16px 16px;border-top:1px solid var(--bd)}
.ac-b.on{display:block}
.ac-b p{font-size:.82rem;color:var(--tx2);line-height:1.7;margin-top:13px}
.ac-b h4{font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);margin:13px 0 7px}
.ac-b ul{list-style:none;padding:0}
.ac-b ul li{font-size:.79rem;color:var(--tx2);padding:5px 0;border-bottom:1px solid rgba(37,45,72,.35);display:flex;gap:8px}
.ac-b ul li:last-child{border-bottom:none}
.ac-b ul li::before{content:'→';color:var(--acc);font-weight:700;flex-shrink:0}
.ac-warn{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);border-radius:7px;padding:9px 12px;margin-top:11px;font-size:.77rem;color:#fcd34d}

/* GALLERY */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.gi{border-radius:9px;overflow:hidden;background:var(--s2);border:1px solid var(--bd);cursor:pointer;transition:transform .15s,border-color .15s;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative}
.gi:hover{transform:translateY(-2px);border-color:var(--acc)}
.gi img{width:100%;height:100%;object-fit:cover}
.gi-tag{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.7);color:white;font-size:.63rem;padding:2px 7px;border-radius:9px;font-weight:700}
.gi-del{position:absolute;top:5px;right:5px;background:rgba(239,68,68,.85);border:none;color:white;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.8rem;display:none;align-items:center;justify-content:center}
.gi:hover .gi-del{display:flex}

/* UPLOAD AREA */
.upload-area{border:2px dashed var(--bd2);border-radius:10px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.upload-area:hover,.upload-area.drag{border-color:var(--acc);background:rgba(245,158,11,.04)}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ua-ic{font-size:2.2rem;margin-bottom:8px}
.ua-title{font-weight:700;font-size:.88rem;margin-bottom:4px}
.ua-sub{font-size:.76rem;color:var(--tx3)}
.thumb-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thumb-item{position:relative;width:80px;height:60px;border-radius:7px;overflow:hidden;border:1px solid var(--bd)}
.thumb-item img{width:100%;height:100%;object-fit:cover}
.thumb-del{position:absolute;top:2px;right:2px;background:rgba(239,68,68,.85);border:none;color:white;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:.65rem;display:flex;align-items:center;justify-content:center}

/* SLIDESHOW */
.ss-wrap{background:var(--s2);border-radius:12px;border:1px solid var(--bd);overflow:hidden;margin-bottom:14px}
.ss-screen{width:100%;height:380px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--s3);overflow:hidden}
.ss-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;animation:ssIn .6s ease}
.ss-img.on{display:block}
@keyframes ssIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.ss-empty{text-align:center;color:var(--tx3)}
.ss-empty .sei{font-size:2rem;margin-bottom:8px}
.ss-ovl{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.ss-cap{font-weight:700;font-size:.92rem;color:white}
.ss-sub{font-size:.74rem;color:rgba(255,255,255,.68)}
.ss-ctrl{display:flex;align-items:center;gap:7px;padding:10px 13px;background:var(--s1);flex-wrap:wrap}
.ss-btn{padding:6px 11px;border-radius:7px;background:var(--s3);border:1px solid var(--bd2);color:var(--tx);cursor:pointer;font-size:.78rem;font-family:var(--fb);transition:all .15s}
.ss-btn:hover{border-color:var(--acc);color:var(--acc)}
.ss-btn.playing{background:rgba(245,158,11,.14);border-color:var(--acc);color:var(--acc)}
.ss-dots{display:flex;gap:4px;flex:1;flex-wrap:wrap;align-items:center}
.ss-dot{width:7px;height:7px;border-radius:50%;background:var(--bd2);transition:all .15s;cursor:pointer;flex-shrink:0}
.ss-dot.on{background:var(--acc);width:18px;border-radius:4px}
.ss-cnt{font-size:.76rem;color:var(--tx3);white-space:nowrap}
.ss-speed{display:flex;align-items:center;gap:5px;font-size:.73rem;color:var(--tx3)}
.ss-speed select{background:var(--s3);border:1px solid var(--bd);border-radius:5px;color:var(--tx);padding:2px 6px;font-size:.72rem;font-family:var(--fb)}

/* FIN CARD */
.fin-card{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:9px}
.fin-ct{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;flex-wrap:wrap;gap:7px}
.fin-cn{font-weight:700;font-size:.86rem}
.fin-row{display:flex;justify-content:space-between;font-size:.79rem;padding:5px 0;border-bottom:1px solid rgba(37,45,72,.35)}
.fin-row:last-child{border-bottom:none}
.fin-row .frl{color:var(--tx3)}

/* ADMIN OBRA CARD */
.ocard{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:11px}
.ocard-top{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.ocard-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:900;font-size:.9rem;color:#000;flex-shrink:0}
.ocard-name{font-weight:700;font-size:.9rem}
.ocard-obra{font-size:.74rem;color:var(--tx3)}
.prog-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:.77rem;color:var(--tx2)}
.pr-label{width:88px;flex-shrink:0}
.pr-bar{flex:1;background:var(--s3);border-radius:3px;height:6px;overflow:hidden}
.pr-fill{height:100%;border-radius:3px}
.pr-pct{width:32px;text-align:right;font-weight:700;font-family:var(--fh);font-size:.76rem}

/* SLIDER */
.slider-wrap{display:flex;align-items:center;gap:10px}
.slider-wrap input[type=range]{flex:1;accent-color:var(--acc);height:4px;cursor:pointer}
.sv{font-family:var(--fh);font-weight:800;font-size:.88rem;color:var(--acc);width:38px;text-align:right}

/* VIS BOX */
.vis-box{background:linear-gradient(135deg,rgba(245,158,11,.09),rgba(249,115,22,.06));border:1px solid rgba(245,158,11,.27);border-radius:11px;padding:16px;margin-bottom:16px}

/* TIPS */
.tip-card{background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:16px;transition:border-color .15s}
.tip-card:hover{border-color:var(--acc)}
.tip-card h3{font-family:var(--fh);font-size:.88rem;font-weight:800;margin-bottom:7px;color:var(--acc)}
.tip-card ul{list-style:none;padding:0}
.tip-card ul li{font-size:.78rem;color:var(--tx2);padding:4px 0;border-bottom:1px solid rgba(37,45,72,.3);display:flex;gap:6px}
.tip-card ul li:last-child{border-bottom:none}
.tip-card ul li::before{content:'·';color:var(--acc);font-weight:900;flex-shrink:0}

/* INLINE EDIT TRIGGER */
.editable-section{border:1px solid transparent;border-radius:8px;padding:4px;transition:border-color .15s;position:relative}
.editable-section:hover{border-color:rgba(245,158,11,.3)}

.editable-section:hover .edit-hint{display:block}

/* SEPARATORS */
.sep{height:1px;background:var(--bd);margin:14px 0}
.empty{text-align:center;padding:28px;color:var(--tx3)}
.empty .ei{font-size:2rem;margin-bottom:7px}

/* LIGHTBOX */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:none;align-items:center;justify-content:center;pointer-events:none}
.lb.on{display:flex;pointer-events:auto}
.lb img{max-width:90vw;max-height:86vh;border-radius:10px;object-fit:contain}
.lb-close{position:absolute;top:16px;right:20px;background:none;border:none;color:white;font-size:1.5rem;cursor:pointer}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:1.2rem;backdrop-filter:blur(8px)}
.lb-prev{left:14px}.lb-next{right:14px}
.lb-info{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:white;font-size:.78rem;padding:6px 14px;border-radius:20px;backdrop-filter:blur(8px)}

/* VÍDEO CONFIGURÁVEL */
.video-cfg{background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:16px;margin-bottom:16px}
.video-cfg h3{font-family:var(--fh);font-size:.85rem;font-weight:900;margin-bottom:13px;color:var(--acc)}
.cfg-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.cfg-item label{display:block;font-size:.63rem;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.cfg-item input[type=range]{width:100%;accent-color:var(--acc)}
.cfg-item select,.cfg-item input[type=number]{width:100%;background:var(--bg);border:1px solid var(--bd2);border-radius:7px;padding:6px 9px;color:var(--tx);font-size:.82rem;font-family:var(--fb)}
.cfg-val{font-family:var(--fh);font-weight:900;font-size:.85rem;color:var(--acc);margin-top:2px}
.ss-transition{animation:ssIn .5s ease!important}
@keyframes ssSlide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes ssZoom{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
@keyframes ssFade{from{opacity:0}to{opacity:1}}
.ss-img.t-slide{animation:ssSlide .5s ease}
.ss-img.t-zoom{animation:ssZoom .6s ease}
.ss-img.t-fade{animation:ssFade .4s ease}

/* IMPORTAÇÃO CASAFÁCIL */
.import-box{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.05));border:1px solid rgba(59,130,246,.3);border-radius:12px;padding:18px;margin-bottom:14px}
.import-box h3{font-family:var(--fh);font-size:.88rem;font-weight:900;color:var(--blue);margin-bottom:10px}
.import-drop{border:2px dashed rgba(59,130,246,.4);border-radius:9px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.import-drop:hover,.import-drop.drag{border-color:var(--blue);background:rgba(59,130,246,.05)}
.import-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.import-ic{font-size:1.8rem;margin-bottom:6px}
.import-title{font-weight:700;font-size:.84rem;margin-bottom:3px}
.import-sub{font-size:.73rem;color:var(--tx3)}
.export-card{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.export-info{font-size:.8rem}
.export-info b{display:block;margin-bottom:2px}
.export-info span{color:var(--tx3);font-size:.73rem}

/* SELEÇÃO DE FOTOS PARA VÍDEO */
.foto-sel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.musica-opt{background:var(--s3);color:var(--tx2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:.78rem;cursor:pointer;text-align:left;transition:all .15s}
.musica-opt:hover{border-color:var(--acc);color:var(--acc)}
.foto-sel-item{position:relative;border-radius:9px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .15s;aspect-ratio:4/3}
.foto-sel-item img{width:100%;height:100%;object-fit:cover;display:block}
.foto-sel-item .fsi-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.foto-sel-item:hover .fsi-overlay{opacity:1}
.foto-sel-item.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(245,158,11,.3)}
.foto-sel-item.sel .fsi-overlay{opacity:1;background:rgba(245,158,11,.3)}
.fsi-check{width:28px;height:28px;background:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900;color:#000}
.fsi-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:white;font-size:.62rem;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--s2);border:1px solid var(--bd);border-radius:9px;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.sel-count{font-family:var(--fh);font-weight:900;font-size:.88rem;color:var(--acc)}

/* VÍDEOS AUTOMÁTICOS */
.video-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:12px;transition:border-color .15s}
.video-card:hover{border-color:var(--bd2)}
.video-card-head{padding:14px 16px;display:flex;align-items:center;gap:12px}
.vc-badge{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.vc-info{flex:1}
.vc-title{font-weight:700;font-size:.88rem;margin-bottom:2px}
.vc-sub{font-size:.72rem;color:var(--tx3)}
.vc-status{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:.68rem;font-weight:700}
.vc-ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.vc-pend{background:rgba(90,103,133,.12);border:1px solid rgba(90,103,133,.25);color:var(--tx3)}
.vc-ready{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--acc)}

/* SLIDESHOW PREMIUM */
@keyframes kZoom{0%{opacity:0;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes kFade{0%{opacity:0}100%{opacity:1}}
@keyframes kSlideL{0%{opacity:0;transform:translateX(40px)}100%{opacity:1;transform:none}}
@keyframes kSlideR{0%{opacity:0;transform:translateX(-40px)}100%{opacity:1;transform:none}}
.ss-img.t-zoom{animation:kZoom .7s ease}
.ss-img.t-fade{animation:kFade .5s ease}
.ss-img.t-slide{animation:kSlideL .5s ease}
.ss-img.t-slide-r{animation:kSlideR .5s ease}
.ss-screen{position:relative}
.ss-progress-bar{position:absolute;bottom:0;left:0;height:3px;background:var(--acc);transition:none;z-index:5}

/* MÁSCARA MONETÁRIA */
.money-input{font-variant-numeric:tabular-nums}

/* DOWNLOAD BTN */
.dl-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:7px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#93c5fd;font-size:.72rem;font-weight:600;cursor:pointer;font-family:var(--fb);transition:all .15s;text-decoration:none}
.dl-btn:hover{background:var(--blue);color:#fff}

/* GALERIA COM DOWNLOAD */
.gi-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.gi:hover .gi-actions{opacity:1}
.gi-dl{width:26px;height:26px;background:rgba(0,0,0,.7);border:none;border-radius:6px;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.75rem;backdrop-filter:blur(4px)}

/* BARRA DRAG PROGRESSO */
.drag-bar-wrap{position:relative;height:28px;cursor:ew-resize;user-select:none;border-radius:6px;padding:0 4px}
.drag-bar-bg{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;height:10px;background:var(--s3);border-radius:6px;overflow:visible}
.drag-bar-fill{height:100%;border-radius:6px;transition:width .08s}
.drag-bar-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:3;transition:left .08s}
.drag-bar-pct{position:absolute;right:-36px;top:50%;transform:translateY(-50%);font-family:var(--fh);font-weight:900;font-size:.8rem;width:34px;text-align:left}

/* FINANCEIRO EXPANSÍVEL */
.fcli{background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.fcli-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s}
.fcli-h:hover{background:var(--s2)}
.fcli-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:900;font-size:.84rem;color:#000;flex-shrink:0}
.fcli-b{display:none;padding:0 16px 16px}
.fcli-b.on{display:block}
.fcli-arr{margin-left:auto;color:var(--tx3);transition:transform .22s;font-size:.75rem;padding-left:8px}
.fcli-arr.open{transform:rotate(180deg)}

/* MÁSCARA MONETÁRIA */
input.money{font-variant-numeric:tabular-nums;letter-spacing:.2px}

/* MÚSICA VÍDEO */
.mus-opt{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--bd);background:none;width:100%;font-family:var(--fb);color:var(--tx);font-size:.81rem;text-align:left;transition:all .15s;margin-bottom:5px}
.mus-opt:hover,.mus-opt.sel{border-color:var(--acc);background:rgba(245,158,11,.07);color:var(--acc)}

.mus-play:hover{border-color:var(--acc);color:var(--acc)}

@media(max-width:900px){
  .sb{width:52px}

function maskMoney(el){
  let v=el.value.replace(/\D/g,'');
  if(!v){el.value='';return;}
  const num=parseInt(v,10);
  el.value='R$ '+((num/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}));
}
function parseMoney(s){
  if(!s||typeof s!=='string')return Number(s)||0;
  return parseFloat(s.replace(/R\$\s*/g,'').replace(/\./g,'').replace(',','.'))||0;
}

  el.addEventListener('input',()=>maskMoney(el));
}

// ── SEGURANÇA ──
async function sha256(msg){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
window.definirSenhaAdmin=async function(novaSenha, senhaAtual){
  if(!novaSenha||novaSenha.length<4){toast('Use ao menos 4 caracteres.',true);return;}
  const cfgDoc=await _db.collection('portal_config').doc('admin').get();
  const hashExistente = cfgDoc.exists ? cfgDoc.data().senhaHash : null;
  if(hashExistente){
    // Já existe senha configurada — exige a senha atual pra trocar (evita reset por qualquer um)
    if(!senhaAtual){ toast('Já existe uma senha configurada. Rode: definirSenhaAdmin("novaSenha","senhaAtual")', true); return; }
    const hAtual = await sha256(senhaAtual);
    if(hAtual!==hashExistente){ toast('❌ Senha atual incorreta — não foi possível trocar.', true); return; }
  }
  const h=await sha256(novaSenha);
  await _db.collection('portal_config').doc('admin').set({senhaHash:h,atualizado:firebase.firestore.FieldValue.serverTimestamp()});
  toast('✅ Senha admin definida!');
};
const _portalLoginTent={count:0,bloqueadoAte:0};

async function doLogin(){
  const u=document.getElementById('l-u').value.trim().toLowerCase();
  const p=document.getElementById('l-p').value;
  const btn=document.getElementById('l-btn');
  const errEl=document.getElementById('l-err');

  // Rate limiting
  const agora=Date.now();
  if(_portalLoginTent.bloqueadoAte>agora){
    const seg=Math.ceil((_portalLoginTent.bloqueadoAte-agora)/1000);
    if(errEl){errEl.textContent='Muitas tentativas. Aguarde '+seg+'s.';errEl.style.display='block';}
    return;
  }

  if(btn){btn.disabled=true;btn.textContent='⏳ Verificando...';}
  if(_fbReady){try{await _carregarDados();}catch(e){}}

  let ok=false;
  try{
    if(loginType==='admin'){
      if(_fbReady){
        const cfgDoc=await _db.collection('portal_config').doc('admin').get();
        if(cfgDoc.exists&&cfgDoc.data().senhaHash){
          const h=await sha256(p);
          ok=(h===cfgDoc.data().senhaHash);
        } else {
          ok=(u==='admin'&&p===(DB.admin.pw||''));
        }
      } else {
        ok=(u==='admin'&&p===(DB.admin.pw||''));
      }
      if(ok){_portalLoginTent.count=0;_portalLoginTent.bloqueadoAte=0;enterAdmin();return;}
    } else {
      const cl=DB.clients[u];
      if(cl){
        if(cl.pwHash){
          const h=await sha256(p);
          ok=(h===cl.pwHash);
        } else {
          ok=(cl.pw===p);
        }
        if(ok){_portalLoginTent.count=0;_portalLoginTent.bloqueadoAte=0;enterClient(u,cl);return;}
      }
    }
  }catch(e){console.error('Erro login:',e);}

  _portalLoginTent.count++;
  if(_portalLoginTent.count>=5){
    _portalLoginTent.bloqueadoAte=Date.now()+60000;
    _portalLoginTent.count=0;
    if(errEl){errEl.textContent='5 tentativas incorretas. Aguarde 60s.';errEl.style.display='block';}
  } else {
    if(errEl){errEl.textContent='Usuário ou senha incorretos. ('+_portalLoginTent.count+'/5)';errEl.style.display='block';setTimeout(()=>errEl.style.display='none',3000);}
  }
  if(btn){btn.disabled=false;btn.textContent='Entrar';}
}

      <pre style="background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:13px;font-size:.69rem;color:#93c5fd;overflow-x:auto;line-height:1.7"><code>// ════════════════════════════════════════════════════
//  COLE ESTE CÓDIGO NO CASAFÁCIL
//  Gera o arquivo JSON completo para o Casa Fácil
// ════════════════════════════════════════════════════

function exportarParaPortal(obraId) {

  // ── Adapte os campos abaixo conforme seu banco de dados ──
  const o    = S.obras.find(x => x.id === obraId);   // objeto da obra
  const cli  = S.clientes.find(x => x.id === o.clienteId); // objeto do cliente
  const eng  = S.usuarios.find(x => x.id === o.engId);     // engenheiro
  const etapas = S.etapas.filter(e => e.obraId === obraId);

  const data = {
    _source:      'casafacil',
    _version:     '2.0',
    _exportDate:  new Date().toISOString(),

    // ── DADOS DO CLIENTE ──
    clienteNome:  cli.nome,
    clienteCpf:   cli.cpf,
    clienteRg:    cli.rg,
    clienteTel:   cli.telefone,
    clienteEmail: cli.email,

    // ── DADOS DA OBRA ──
    nomeObra:     o.descricao || o.nome,
    endereco:     o.logradouro + ', ' + o.numero + ' — ' + o.bairro + ' · ' + o.cidade + '/' + o.uf,
    matricula:    o.matricula,
    inicio:       o.dataInicio ? new Date(o.dataInicio).toLocaleDateString('pt-BR') : '',
    previsaoEntrega: o.prazo   ? new Date(o.prazo).toLocaleDateString('pt-BR',{month:'short',year:'numeric'}) : '',
    totalContrato: o.valorContrato,
    valorEntrada:  o.valorEntrada || 0,
    totalPago:     etapas.filter(e=>e.status==='concluida').reduce((s,e)=>s+(+e.valorRecebido||0),0),

    // ── ENGENHEIRO ──
    engNome:  eng ? eng.nome  : '',
    engCrea:  eng ? eng.crea  : '',
    engTel:   eng ? eng.fone  : '',
    engEmail: eng ? eng.email : '',

    // ── ADMINISTRADOR ──
    admTel:   S.config?.telAdm   || '',
    admEmail: S.config?.emailAdm || '',

    // ── ETAPAS ──
    etapas: etapas.map(e => ({
      nome:    e.descricao,
      icon:    e.icone || '',
      pct:     e.status==='concluida'?100 : e.status==='em-andamento'?(e.percentual||50) : 0,
      status:  e.status==='concluida'?'done' : e.status==='em-andamento'?'active' : 'pending',
      previsto: e.valorPrevisto || e.valor || 0,
      pago:    e.status==='concluida' ? (+e.valorRecebido||0) : null,
      dataPag: e.dataConclusao ? new Date(e.dataConclusao).toLocaleDateString('pt-BR') : null,
      desc:    e.descricaoDetalhada || '',
      itens:   e.itens || [],
      v30:     e.vistoria30 || '⏳ Aguardando',
      v85:     e.vistoria85 || '⏳ Aguardando',
    })),

    // ── ATUALIZAÇÕES ──
    atualizacoes: (S.atualizacoes||[])
      .filter(a=>a.obraId===obraId)
      .slice(0,10)
      .map(a=>({
        data:   new Date(a.data).toLocaleDateString('pt-BR'),
        titulo: a.titulo,
        desc:   a.descricao || '',
        dot:    a.tipo==='concluido'?'done':'active'
      }))
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'obraViva-' + (cli.nome||obraId).replace(/\s+/g,'-').toLowerCase() + '.json';
  a.click();
  alert('✅ Arquivo gerado para: ' + cli.nome);
}</code></pre>

// ── DASHBOARD MENSAL ──
let _dashMesAtual = new Date().toISOString().slice(0,7); // 'YYYY-MM'

function dashMesNav(dir){
  const [ano, mes] = _dashMesAtual.split('-').map(Number);
  const d = new Date(ano, mes-1+dir, 1);
  _dashMesAtual = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  renderDashMensal();
}

function dashMesHoje(){
  _dashMesAtual = new Date().toISOString().slice(0,7);
  renderDashMensal();
}

function renderDashMensal(){
  const labelEl=document.getElementById('dash-mes-label');
  const listaEl=document.getElementById('dash-mensal-lista');
  const totalEl=document.getElementById('dash-mes-total');
  if(!labelEl||!listaEl||!totalEl)return;

  const parts=_dashMesAtual.split('-');
  const ano=parts[0], mes=parts[1];
  const nomes=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  labelEl.textContent=nomes[+mes]+' '+ano;

  // Coletar todos os pagamentos
  const todosPag=[];
  Object.entries(DB.obras).forEach(function([id,o]){
    const cli=Object.entries(DB.clients).find(function([,c]){return c.obraId===id;});
    o.etapas.filter(function(e){return e.pago&&e.dataPag;}).forEach(function(e){
      const p=e.dataPag.split('/');
      if(p.length===3){
        todosPag.push({
          nome:cli?cli[1].name:'—',
          initials:cli?cli[1].initials:'?',
          color:cli?cli[1].color:'var(--acc)',
          etapa:e.nome, icon:e.icon||'🏗️',
          data:e.dataPag, valor:+(e.pago)||0,
          pMes:p[1], pAno:p[2]
        });
      }
    });
  });

  // Card: Recebido no mês
  const pagMes=todosPag.filter(function(p){return p.pMes===mes&&p.pAno===ano;});
  const totalMes=pagMes.reduce(function(s,p){return s+p.valor;},0);
  const cv=document.getElementById('card-mes-valor');
  const cl=document.getElementById('card-mes-label');
  if(cv)cv.textContent='R$ '+totalMes.toLocaleString('pt-BR',{minimumFractionDigits:2});
  if(cl)cl.textContent=nomes[+mes]+'/'+ano;

  // Card: Total recebido no ano
  const pagAno=todosPag.filter(function(p){return p.pAno===ano;});
  const totalAno=pagAno.reduce(function(s,p){return s+p.valor;},0);
  const av=document.getElementById('card-ano-valor');
  const al=document.getElementById('card-ano-label');
  if(av)av.textContent='R$ '+totalAno.toLocaleString('pt-BR',{minimumFractionDigits:2});
  if(al)al.textContent='total em '+ano;

  // Painel: total do mês
  totalEl.textContent='R$ '+totalMes.toLocaleString('pt-BR',{minimumFractionDigits:2});

  // Lista do mês
  pagMes.sort(function(a,b){
    return b.data.split('/').reverse().join('').localeCompare(a.data.split('/').reverse().join(''));
  });

  if(!pagMes.length){
    listaEl.innerHTML='<div style="text-align:center;padding:28px 0;color:var(--tx3);font-size:.82rem">Nenhum pagamento em '+nomes[+mes]+'/'+ano+'.</div>';
    return;
  }

  listaEl.innerHTML=pagMes.map(function(p){
    return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)">'
      +'<div style="width:32px;height:32px;border-radius:50%;background:'+p.color+';display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:900;font-size:.72rem;color:#000;flex-shrink:0">'+p.initials+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-weight:700;font-size:.83rem">'+p.nome+'</div>'
      +'<div style="font-size:.71rem;color:var(--tx3);margin-top:1px">'+p.icon+' '+p.etapa+' · '+p.data+'</div>'
      +'</div>'
      +'<div style="font-weight:800;color:var(--green);font-size:.88rem;white-space:nowrap">R$ '+p.valor.toLocaleString('pt-BR',{minimumFractionDigits:2})+'</div>'
      +'</div>';
  }).join('');
}

function setupDrop(){

  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');handleFiles(Array.from(e.dataTransfer.files));});

function fileToCompressedDataURL(file, maxDim, quality){
  return new Promise(function(resolve){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(err){ resolve(e.target.result); }
      };
      img.onerror = function(){ resolve(e.target.result); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ resolve(null); };
    reader.readAsDataURL(file);
  });
}
async function handleFileSelect(evt){
  await handleFiles(Array.from(evt.target.files));
}

async function handleFiles(files){
  const imgs=files.filter(f=>f.type.startsWith('image/'));
  if(!imgs.length){toast('⚠️ Selecione apenas imagens.',true);return;}
  for(const f of imgs){
    const dataUrl=await fileToCompressedDataURL(f, 1600, 0.72);
    if(dataUrl) pendingFotos.push({src:dataUrl,name:f.name});
  }
  renderThumbs();
}

function renderThumbs(){
  const el=document.getElementById('af-thumbs');
  const act=document.getElementById('af-actions');
  el.innerHTML=pendingFotos.map((f,i)=>`<div class="thumb-item"><img src="${f.src}"><button class="thumb-del" onclick="removePending(${i})">✕</button></div>`).join('');
  if(act)act.style.display=pendingFotos.length?'flex':'none';
  const cnt=document.getElementById('af-count');if(cnt)cnt.textContent=pendingFotos.length;
}

function removePending(i){pendingFotos.splice(i,1);renderThumbs();}

  pendingFotos=[];

function confirmarUpload(){
  if(!pendingFotos.length){toast('⚠️ Nenhuma foto selecionada.',true);return;}
  const oId=document.getElementById('af-obra').value;
  const etId=document.getElementById('af-etapa').value;
  const label=document.getElementById('af-label').value.trim()||'Foto da obra';
  const date=document.getElementById('af-date').value.trim()||'—';
  const o=DB.obras[oId];if(!o)return;
  const ts=Date.now();
  pendingFotos.forEach((f,i)=>{

function enterClient(login,c){
  role='cliente';
  // Aguarda Firebase carregar os dados mais recentes antes de abrir
  const _abrirCliente = function(){
    // SEMPRE buscar dados frescos do Firestore obraviva (nunca usar cache)
    // Isso garante que atualizações do CasaFácil aparecem imediatamente
    obraId = c.obraId;
    if(!_fbReady || !_db){
      alert('Sem conexão com Firebase. Recarregue a página.'); return;
    }
    // Tentar as chaves possíveis: obraId, login, primeiro nome
    var tentativas = [c.obraId];
    var loginLimpo = login.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(tentativas.indexOf(loginLimpo)<0) tentativas.push(loginLimpo);
    var primeiroNome = (c.name||'').split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g,'');
    if(primeiroNome && tentativas.indexOf(primeiroNome)<0) tentativas.push(primeiroNome);
    
    var idx = 0;
    function tentarChave(){
      if(idx >= tentativas.length){
        alert('Obra não encontrada no servidor (chave: '+tentativas[0]+'). Exporte a obra pelo CasaFácil primeiro.');
        return;
      }
      var chave = tentativas[idx++];
      _db.collection('obraviva').doc(chave).get().then(function(doc){
        if(doc.exists && doc.data() && Object.keys(doc.data()).length > 0){
          obra = doc.data();
          obraId = chave;
          DB.obras[chave] = obra;
          window._clienteLogin = login; // guardar login para filtro de documentos
          window._clienteChaveObra = chave; // chave real que bateu no Firestore (obraviva) — usada também pra obraviva_planta
          // Mostrar portal
          document.getElementById('login-screen').style.display='none';
          document.getElementById('app').style.display='flex';
          var av=document.getElementById('sb-av');
          if(av){av.textContent=c.initials||'?';av.style.background=c.color||'#f59e0b';}
          var sbn=document.getElementById('sb-name');if(sbn)sbn.textContent=c.name||'';
          var sbr=document.getElementById('sb-role');
          if(sbr)sbr.textContent=(obra.nomeObra||obra.nome||'').split('–')[0].trim();
          buildClientNav(); buildClientPages(); buildVideoPersonalizado();
          // Listener em tempo real para atualizações automáticas
          _iniciarListenerTempoReal(chave);
          _iniciarPolling(chave);
          setTimeout(function(){ go('c-dash'); }, 50);
          // Buscar fotos e vídeos de portal/dados (onde o admin salva as mídias)
          _carregarFotosDoPortal(chave);
          // Carregar documentos e renderizar após DOM estar pronta
          setTimeout(function(){ _carregarDocumentosDoPortal(); }, 500);
        } else {
          tentarChave();
        }
      }).catch(function(e){
        console.warn('[portal] Erro em '+chave+':', e);
        tentarChave();
      });
    }
    tentarChave();
  };
  // Para clientes: buscar sempre direto do obraviva (dados frescos)
  // _carregarDados carrega dados admin, não necessário para cliente
  _abrirCliente();
}

    <div class="ph"><div><h1>Financiamento MCMV</h1><p>Como funciona o seu financiamento</p></div></div>
    ${(()=>{try{return buildDicasFinanciamento();}catch(e){console.warn('buildDicasFinanciamento erro:',e);return '';}})()}
  </div>

  <!-- FOTOS -->
  <div class="page" id="pg-c-fotos">
    ${(()=>{try{return buildSlideshow(o.fotos);}catch(e){console.warn("buildSlideshow erro:",e);return "";}})()}
  </div>

  <!-- VÍDEO -->
  <div class="page" id="pg-c-video">
    <div class="ph"><div><h1>Vídeo da Evolução</h1><p>Crie seu vídeo personalizado e baixe</p></div></div>

    <div class="card" style="margin-bottom:14px">
      <div style="font-family:var(--fh);font-weight:900;margin-bottom:12px">🎬 Selecione as fotos por etapa</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <span style="font-size:.8rem;color:var(--tx3)"><span id="sel-count">0</span> fotos selecionadas</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-s btn-sm" onclick="selecionarTodasFotos()">Todas</button>
          <button class="btn btn-s btn-sm" onclick="limparSelecaoFotos()">Limpar</button>
        </div>
      </div>
      <div id="foto-sel-grid"></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div style="font-family:var(--fh);font-weight:900;margin-bottom:12px">⚙️ Configurações</div>
      <div class="cfg-row">
        <div class="cfg-item">
          <label>Intervalo entre fotos</label>
          <input type="range" min="1" max="10" step="0.5" value="3" id="meu-vel"
            oninput="document.getElementById('meu-vel-val').textContent=this.value+'s'">
          <div class="cfg-val" id="meu-vel-val">3s</div>
        </div>
        <div class="cfg-item">
          <label>Transição</label>
          <select id="meu-trans">
            <option value="zoom">🔍 Zoom</option>
            <option value="fade">✨ Fade</option>
            <option value="slide">➡️ Slide</option>
          </select>
        </div>
      </div>
      <div class="cfg-item" style="margin-top:10px">
        <label>Seu nome no vídeo (opcional)</label>
        <input type="text" id="video-nome-exib" placeholder="Ex: João da Silva — aparecerá no canto do vídeo"
          style="width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;color:var(--tx1);font-size:.82rem">
      </div>
    </div>

    

    <div id="meu-video-player" style="display:none" class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div style="font-family:var(--fh);font-weight:900">▶️ Pré-visualização</div>
        <div style="display:flex;gap:6px;align-items:center">
          <span id="meu-ss-cnt" style="font-size:.75rem;color:var(--tx3)">1 / 0</span>
          <button id="meu-ss-play" onclick="toggleMeuSS()" style="background:#f59e0b;color:#000;border:none;border-radius:8px;padding:8px 20px;font-weight:900;font-size:.88rem;cursor:pointer;display:flex;align-items:center;gap:6px">▶ Play</button>
          <button class="btn btn-s btn-sm" onclick="prevMeuSS()">‹</button>
          <button class="btn btn-s btn-sm" onclick="nextMeuSS()">›</button>
        </div>
      </div>
      <div id="meu-ss-screen" class="ss-screen" style="border-radius:10px;margin-bottom:10px"></div>
      <div id="meu-ss-dots" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px"></div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">
      <button onclick="previewMeuVideo()" style="flex:1;min-width:140px;background:var(--s3);color:var(--tx1);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;font-weight:700;font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">▶ Pré-visualizar</button>
      <button onclick="baixarMeuVideo()" style="flex:1;min-width:140px;background:#f59e0b;color:#000;border:none;border-radius:10px;padding:12px 16px;font-weight:900;font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">⬇️ Baixar Vídeo</button>
      <button onclick="salvarMeuVideoNoSite()" style="flex:1;min-width:140px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.35);color:#818cf8;border-radius:10px;padding:12px 16px;font-weight:900;font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">💾 Salvar no Site</button>
    </div>
  </div>

  <!-- ETAPAS -->
  <div class="page" id="pg-c-etapas">
    <div class="ph"><div><h1>Etapas Construtivas</h1><p>O que acontece em cada fase da sua obra</p></div></div>
    ${_preencherEtapasDefault(o.etapas).map((e,ei)=>`<div class="card" style="margin-bottom:10px;padding:0;overflow:hidden">
      <div onclick="toggleAC(this)" style="display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer">
        <div style="width:42px;height:42px;border-radius:50%;background:${barColor(e.status)};display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0">${e.icon}</div>
        <div style="flex:1">
          <div style="font-family:var(--fh);font-weight:900;font-size:.92rem">${e.nome}</div>
          <div style="font-size:.72rem;color:var(--tx3);margin-top:2px">${statusLabel(e.status)} · ${e.pct}% concluído</div>
        </div>
        <span class="ac-arr" style="color:var(--tx3);font-size:.8rem">▼</span>
      </div>
      <div class="ac-b" style="padding:0 16px 14px">
        <div style="margin-bottom:10px"><div class="pt"><div class="pf" style="width:${e.pct}%;background:${barColor(e.status)}"></div></div></div>
        ${e.desc?`<p style="font-size:.82rem;color:var(--tx2);margin-bottom:12px;line-height:1.6">${e.desc}</p>`:''}
        ${e.itens&&e.itens.length?`<div style="margin-bottom:8px">${e.itens.map(it=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--bd);font-size:.8rem;color:var(--tx2)"><span style="color:var(--acc);flex-shrink:0">▸</span>${it}</div>`).join('')}</div>`:''}
        ${e.aviso?`<div class="al al-y" style="padding:8px 12px;font-size:.78rem;margin-top:8px"><div class="ai">⚠️</div><div>${e.aviso}</div></div>`:''}
      </div>
    </div>`).join('')}
  </div>

  <!-- DICAS -->
  <div class="page" id="pg-c-dicas">
    <div class="ph"><div><h1>Dicas &amp; Escolhas</h1><p>Decisões importantes para sua obra</p></div></div>
    <div id="dicas-conteudo">${(()=>{try{return buildDicasFinanciamento();}catch(e){return '';}})()}</div>
    <div class="card" style="margin-top:12px;border:1.5px solid #7c3aed">
      <div style="font-weight:700;font-size:.95rem;color:#7c3aed;margin-bottom:4px">📊 Simulador de Amortização</div>
      <div style="font-size:.78rem;color:var(--tx3);margin-bottom:12px">Calcule o impacto de amortizações extras no seu financiamento</div>
      <div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:9px;padding:12px;margin-bottom:14px;font-size:.78rem;color:var(--tx2);line-height:1.7"><b>⚠️ Valores estimados</b> — modelo matemático padrão. A Caixa aplica TR variável, seguro anual e arredondamentos próprios.</div>
      <div style="background:var(--s2);border-radius:9px;padding:14px;margin-bottom:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
          <div style="font-weight:700;font-size:.82rem;color:var(--acc)">📋 1. Dados do financiamento</div>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="file" id="sa-pdf-input" accept=".pdf" style="display:none" onchange="saImportarPDF(this)">
            <button onclick="saAutoCarregarContrato(true)" title="Recarregar do seu contrato" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green);border-radius:7px;padding:6px 10px;font-size:.72rem;cursor:pointer">🔄</button>
            <button onclick="document.getElementById('sa-pdf-input').click()" style="background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:#60a5fa;border-radius:7px;padding:6px 12px;font-size:.75rem;cursor:pointer;display:flex;align-items:center;gap:5px">📂 Importar outro arquivo</button>
          </div>
        </div>
        <div id="sa-auto-status" style="display:none;margin-bottom:10px;font-size:.76rem;color:var(--tx3)"></div>
        <div id="sa-docs-lista" style="display:none;margin-bottom:10px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:10px"></div>
        <div id="sa-import-msg" style="display:none;margin-bottom:8px;padding:8px 12px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:7px;font-size:.75rem;color:var(--green)"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px">
          <div><label style="font-size:.72rem;color:var(--tx3);display:block;margin-bottom:3px">Valor financiado</label><input type="text" id="sa-vf" placeholder="R$ 0,00" value="" style="width:100%;padding:8px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.84rem"></div>
          <div><label style="font-size:.72rem;color:var(--tx3);display:block;margin-bottom:3px">Taxa de juros (% a.a.)</label><input type="text" id="sa-taxa" placeholder="Ex: 6,50%" value="" style="width:100%;padding:8px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.84rem"></div>
          <div><label style="font-size:.72rem;color:var(--tx3);display:block;margin-bottom:3px">Prazo (meses)</label><input type="text" id="sa-prazo" placeholder="Ex: 420" value="" style="width:100%;padding:8px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.84rem"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:10px">
          <div><label style="font-size:.72rem;color:var(--tx3);display:block;margin-bottom:3px">Sistema</label><select id="sa-sis" style="width:100%;padding:8px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.84rem"><option value="PRICE" selected>PRICE — parcela fixa</option><option value="SAC">SAC — parcela decrescente</option></select></div>
          <div><label style="font-size:.72rem;color:var(--tx3);display:block;margin-bottom:3px">Subsídio (R$)</label><input type="text" id="sa-sub" placeholder="R$ 0,00" value="" style="width:100%;padding:8px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.84rem"></div>
          <div><label style="font-size:.72rem;color:var(--tx3);display:block;margin-bottom:3px">Parcelas já pagas</label><input type="text" id="sa-pagas" placeholder="0" value="" style="width:100%;padding:8px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.84rem"></div>
          <div><label style="font-size:.72rem;color:var(--tx3);display:block;margin-bottom:3px">Saldo devedor (R$)</label><input type="text" id="sa-saldo-atual" placeholder="Calculado automaticamente" value="" style="width:100%;padding:8px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.84rem"><div style="font-size:.65rem;color:var(--tx3);margin-top:2px">calculado auto ou informe o real</div></div>
        </div>
        <!-- Campo 1ª Parcela - mesmo visual dos outros campos -->
        <div style="display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px">
          <div><label style="font-size:.72rem;color:var(--tx3);display:block;margin-bottom:3px">💳 1ª Prestação (R$)</label>
            <input type="text" id="sa-prim-parc-input" placeholder="Ex: R$ 589,13" value=""
              style="width:100%;padding:8px;border-radius:7px;border:1px solid var(--bd2);background:var(--s2);color:var(--tx);font-size:.9rem"
              title="Valor da 1ª prestação — preenchido pelo PDF ou informe manualmente">
          </div>
        </div>
        <div style="background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.25);border-radius:9px;padding:12px;margin-top:12px">
          <div style="font-weight:700;font-size:.78rem;color:#a78bfa;margin-bottom:8px">🧮 Não sabe o valor da 1ª prestação? Calcule automaticamente (MCMV — regras vigentes desde abr/2026)</div>
          <div style="font-size:.68rem;color:var(--tx3);margin-bottom:8px">Usamos a <b>data de nascimento</b> (não a idade) porque o MIP recalcula pela idade atual a cada simulação — evita ficar desatualizado com o passar do tempo.</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px">
            <div><label style="font-size:.7rem;color:var(--tx3);display:block;margin-bottom:3px">Devedor 1 — Data de nascimento</label><input type="date" id="sa-nasc1" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.82rem"></div>
            <div><label style="font-size:.7rem;color:var(--tx3);display:block;margin-bottom:3px">% Composição de renda</label><input type="text" id="sa-pct1" placeholder="Ex: 100" value="100" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.82rem"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">
            <div><label style="font-size:.7rem;color:var(--tx3);display:block;margin-bottom:3px">Devedor 2 (se houver) — Data de nascimento</label><input type="date" id="sa-nasc2" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.82rem"></div>
            <div><label style="font-size:.7rem;color:var(--tx3);display:block;margin-bottom:3px">% Composição de renda</label><input type="text" id="sa-pct2" placeholder="Ex: 0" value="0" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.82rem"></div>
          </div>
          <div><label style="font-size:.7rem;color:var(--tx3);display:block;margin-bottom:3px">Valor do imóvel (R$)</label><input type="text" id="sa-valor-imovel" placeholder="Se vazio, usa o valor financiado" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.82rem;margin-bottom:8px"></div>
          <button type="button" onclick="saCalcularAutomatico()" style="background:#7c3aed;color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:.8rem;font-weight:700;cursor:pointer;width:100%">Calcular MIP + DFI + Taxa Admin + 1ª Parcela</button>
          <div id="sa-calc-detalhe" style="display:none;margin-top:8px;font-size:.72rem;color:var(--tx2);line-height:1.8"></div>
          <div style="font-size:.65rem;color:var(--tx3);margin-top:6px">Precisa de: valor financiado, taxa de juros e prazo já preenchidos acima. O cálculo usa a Tabela PRICE e as tabelas oficiais de MIP (seguro morte/invalidez, por devedor e % de renda) e DFI (seguro do imóvel) da CAIXA. Se só houver 1 devedor, deixe o Devedor 2 com % = 0.</div>
        </div>
        <div id="sa-info-saldo" style="display:none;margin-top:8px;font-size:.75rem;color:#1d4ed8;padding:8px 10px;background:rgba(59,130,246,.06);border-radius:7px"></div>

      </div>
      <div style="background:var(--s2);border-radius:9px;padding:14px;margin-bottom:10px">
        <div style="font-weight:700;font-size:.82rem;color:var(--acc);margin-bottom:12px">⚡ 2. Como você quer amortizar?</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <label style="flex:1;min-width:160px;cursor:pointer"><input type="radio" name="sa-tipo" value="prazo" checked id="sa-prazo-r"><div id="card-prazo" style="margin-top:4px;border:1.5px solid var(--acc);border-radius:9px;padding:12px"><div style="font-weight:700;font-size:.84rem">⏱️ Reduzir o prazo</div><div style="font-size:.74rem;color:var(--tx3);margin-top:4px">Parcela igual, termina antes, economiza mais juros.</div></div></label>
          <label style="flex:1;min-width:160px;cursor:pointer"><input type="radio" name="sa-tipo" value="parcela" id="sa-parc-r"><div id="card-parcela" style="margin-top:4px;border:1.5px solid var(--bd);border-radius:9px;padding:12px"><div style="font-weight:700;font-size:.84rem">📉 Reduzir a parcela</div><div style="font-size:.74rem;color:var(--tx3);margin-top:4px">Prazo igual, parcela mensal menor.</div></div></label>
        </div>
        <div style="margin-bottom:12px"><label style="font-size:.78rem;font-weight:700;color:var(--tx2);display:block;margin-bottom:6px">Valor de cada amortização extra:</label><input type="text" id="sa-vamort" placeholder="Ex: R$ 5.000,00" value="" oninput="maskMoney(this)" style="width:100%;max-width:220px;padding:9px 12px;border-radius:8px;border:1.5px solid var(--acc);background:var(--s1);color:var(--tx);font-size:1rem;font-weight:700"></div>
        <div style="margin-bottom:12px">
          <div style="font-size:.78rem;font-weight:700;color:var(--tx2);margin-bottom:8px">Frequência:</div>
          <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;align-items:center">
            <label style="cursor:pointer;display:flex;align-items:center;gap:4px"><input type="radio" name="sa-freq" value="mensal" id="sa-freq-mensal"> Todos os meses</label>
            <label style="cursor:pointer;display:flex;align-items:center;gap:4px"><input type="radio" name="sa-freq" value="anual" id="sa-freq-anual" checked> Uma vez por ano</label>
            <label style="cursor:pointer;display:flex;align-items:center;gap:4px"><input type="radio" name="sa-freq" value="unica" id="sa-freq-unica"> Apenas uma vez</label>
            <label style="cursor:pointer;display:flex;align-items:center;gap:4px"><input type="radio" name="sa-freq" value="custom" id="sa-freq-custom"> A cada <input type="text" id="sa-freq-x" value="6" style="width:45px;padding:4px 6px;border-radius:6px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.82rem;text-align:center;margin:0 4px"> meses</label>
          </div>
          <div id="sa-freq-desc" style="font-size:.72rem;color:var(--tx3);margin-top:6px;padding:6px 10px;background:var(--s1);border-radius:6px">Uma vez por ano (12 em 12 meses)</div>
        </div>
        <div><div style="font-size:.78rem;font-weight:700;color:var(--tx2);margin-bottom:6px">Início:</div><div style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--tx2)"><span>A partir da parcela nº</span><input type="text" id="sa-ini" value="12" style="width:60px;padding:6px 8px;border-radius:7px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:.9rem;text-align:center"><span style="font-size:.72rem;color:var(--tx3)">(mínimo 12 para FGTS)</span></div></div>
      </div>
      <div id="sa-aviso-sub" style="display:none;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px;font-size:.78rem;color:#dc2626;margin-bottom:10px"></div>
      <div style="text-align:center;margin:16px 0"><button id="btn-sa-calcular" style="background:var(--acc);color:#000;border:none;border-radius:10px;padding:14px 40px;font-family:var(--fh);font-weight:900;font-size:1rem;cursor:pointer;width:100%;max-width:320px">📊 CALCULAR SIMULAÇÃO</button></div>
      <div id="sa-resultados" style="display:none">
        <div style="height:1px;background:var(--bd);margin:4px 0 16px"></div>
        <div style="background:rgba(22,163,74,.12);border:2px solid #16a34a;border-radius:10px;padding:16px;text-align:center;margin-bottom:12px"><div style="font-size:.75rem;color:#16a34a;font-weight:700;margin-bottom:4px">💰 ECONOMIA TOTAL EM JUROS</div><div style="font-weight:900;font-size:1.8rem;color:#16a34a" id="sa-rec">—</div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
          <div style="background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:14px;text-align:center"><div style="font-size:.7rem;color:var(--tx3);margin-bottom:4px">⛔ Sem amortização — juros totais</div><div style="font-weight:700;font-size:1.1rem;color:#dc2626" id="sa-rj-sem">—</div></div>
          <div style="background:rgba(22,163,74,.07);border:1px solid rgba(22,163,74,.2);border-radius:10px;padding:14px;text-align:center"><div style="font-size:.7rem;color:var(--tx3);margin-bottom:4px">✅ Com amortização — juros totais</div><div style="font-weight:700;font-size:1.1rem;color:#16a34a" id="sa-rj-com">—</div></div>
        </div>

function buildDicasFinanciamento(){

      <p style="font-size:.81rem;color:var(--tx2)">⚠️ É fundamental que a obra esteja visualmente "adiantada" nas datas das vistorias. O engenheiro avalia o que está construído — não o que está planejado.</p>`

    {
      icon:'💸',titulo:'O que é a T.A.O — Taxa de Administração de Obra',
      corpo:`<p>A <b>T.A.O (Taxa de Administração de Obra)</b> é um encargo cobrado pela CAIXA Econômica Federal para cobrir os custos de acompanhamento técnico do financiamento. Ela incide sobre o valor total do crédito habitacional.</p>

    },
    {
      icon:'📋',titulo:'Meu projeto foi aprovado — e agora? Próximos passos',
      corpo:`<p>Parabéns! Com o projeto aprovado, a ansiedade é grande para ver a obra começar. Veja o caminho completo até o primeiro tijolo:</p>
      <div style="margin:14px 0">

          ['1','🏦','Entrada na correspondente bancária','Você (ou a CasaFácil, se já não foi feito) dá entrada em toda a documentação na correspondente credenciada CAIXA. É aqui que o processo bancário é formalmente aberto.','var(--blue)'],
          ['2','👷','Avaliação do terreno pelo engenheiro CAIXA','O banco agenda a visita do engenheiro credenciado ao seu terreno. <b>O custo desta avaliação é de aproximadamente R$ 750,00</b> e é pago pelo financiado. O engenheiro verifica se o terreno e o projeto são compatíveis.','var(--purple)'],
          ['3','📁','Retorno da documentação ao banco','Com o laudo de avaliação aprovado, toda a documentação volta para análise final na CAIXA. Este é o momento de aguardar: o banco faz a análise de crédito definitiva, verifica a matrícula do imóvel e valida o contrato.','var(--orange)'],
          ['4','✍️','Assinatura do contrato','Você é convocado para comparecer à agência CAIXA (ou correspondente) para assinar o contrato de financiamento. Leve todos os documentos originais. A partir da assinatura, a obra pode ter início.','var(--green)'],
        ].map(([n,ic,t,d,c])=>`

            <div style="min-width:34px;height:34px;border-radius:50%;background:${c};display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:900;font-size:.88rem;color:#000">${n}</div>

    {
      icon:'🏗️',titulo:'Início da obra — como e quando começa',
      corpo:`<p>Depois de toda a burocracia, chega o momento mais esperado. Mas o início da obra exige alguns cuidados importantes para que tudo corra bem.</p>
      <div class="al al-g" style="margin:12px 0"><div class="ai">📁</div><div><div class="at">Documentação completa antes de tudo</div><div class="as">A CasaFácil aguarda que <b>toda a documentação esteja regularizada</b> antes de iniciar qualquer serviço. Isso inclui a nova matrícula do imóvel, ITBI recolhido, ART do engenheiro registrada, licença de construção e contrato assinado. Esse cuidado evita que uma etapa não seja liberada por irregularidade documental — o que atrasaria o recebimento e a obra.</div></div></div>

          <li style="display:block"><b>2. Registro em cartório</b> — com o ITBI quitado, dá-se entrada no Cartório de Registro de Imóveis para gerar a nova matrícula do imóvel em nome do cliente, já constando a alienação fiduciária em favor do banco. Esse é normalmente o passo que mais leva tempo (costuma variar de acordo com a demanda do cartório).</li>
          <li style="display:block"><b>3. Início efetivo da obra</b> — topografia, marcação do terreno e primeiro serviço de fundação.</li>
          <li style="display:block"><b>4. Liberação das parcelas conforme o andamento</b> — o financiamento por construção libera o dinheiro aos poucos, por medição: a cada etapa concluída, o engenheiro da CasaFácil tira fotos do que foi executado e envia para a CAIXA. O banco libera o valor correspondente diretamente ao cliente, que então repassa para a CasaFácil dar continuidade à obra.</li>
        </ul>
      </div>
      <div class="al al-y"><div class="ai">⚠️</div><div><div class="at">Por que esperar a documentação?</div><div class="as">Se a obra iniciar sem a matrícula nova ou o ITBI quitado, o engenheiro CAIXA pode recusar a vistoria e bloquear a liberação da etapa. O atraso documental pode custar semanas de obra parada — por isso vale a pena acompanhar de perto o andamento no cartório e na prefeitura.</div></div></div>`

        <div style="display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:.82rem;color:var(--tx2)"><span style="color:var(--acc)">▸</span><span><b>Taxa de administração</b> — R$25 fixos, cobrados pela Caixa</span></div>

      <p style="font-size:.81rem">Existem dois jeitos de organizar essas parcelas: <b>PRICE</b> (parcela sempre igual do início ao fim) e <b>SAC</b> (parcela começa mais alta e vai diminuindo com o tempo). O simulador logo abaixo já calcula as duas opções pra você.</p>

      <button onclick="go('c-contato',null)" style="margin-top:10px;width:100%;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.4);color:#a78bfa;border-radius:9px;padding:10px;font-weight:700;font-size:.82rem;cursor:pointer">💬 Falar com a equipe</button>`

function getNextStep(o){
  const ativa=o.etapas.find(e=>e.status==='active');
  if(!ativa)return'Obra concluída! Aguardando entrega das chaves.';
  if(ativa.pct>=85&&!ativa.pago)return`${ativa.nome} está em ${ativa.pct}% — aguardando vistoria do engenheiro para liberar o pagamento.`;
  return`${ativa.nome} em andamento (${ativa.pct}%). Vistoria técnica ao atingir ${ativa.pct<30?'30':'85'}%.`;
}

function baixarVideoMarco(marcoId){
  if(!obra||!obra.fotos||!obra.fotos.length){toast('⚠️ Sem fotos para gerar o vídeo.',true);return;}
  const m=MARCOS.find(function(x){return x.id===marcoId;});
  if(!m) return;
  const fotos=selecionarFotosMarco(marcoId, obra.fotos);
  if(!fotos.length){toast('⚠️ Sem fotos para este marco.',true);return;}
  const pct=Math.round(obra.etapas.reduce(function(s,e){return s+(e.pct||0);},0)/Math.max(obra.etapas.length,1));
  const nomeObra=obra.nome.split('–')[0].trim();
  const titulo=m.titulo.split('—')[1]?.trim()||m.titulo;
  toast('⏳ Preparando vídeo do marco...');
  function toB64(src){
    return fetch(src).then(function(r){return r.blob();}).then(function(b){
      return new Promise(function(res){var rd=new FileReader();rd.onloadend=function(){res(rd.result);};rd.readAsDataURL(b);});
    }).catch(function(){return src;});
  }
  Promise.all(fotos.map(function(f){return toB64(f.src);})).then(function(b64s){
    const fotosB64=fotos.map(function(f,i){return Object.assign({},f,{src:b64s[i]});});
    const caps=fotosB64.map(function(f){return JSON.stringify(f.label||'');}).join(',');
    const dates=fotosB64.map(function(f){return JSON.stringify(f.date||'');}).join(',');
    const imgsHTML=fotosB64.map(function(f,i){return '<img class="fr'+(i===0?' on':'')+'" src="'+f.src+'" alt="'+(f.label||'')+'">';}).join('\n');
    const logo=LOGO_B64||'';
    const cor=m.cor.replace('var(--blue)','#3b82f6').replace('var(--orange)','#f59e0b').replace('var(--green)','#22c55e');
    const glow=cor==='#3b82f6'?'59,130,246':cor==='#22c55e'?'34,197,94':'245,158,11';
    const page='<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">\n<title>'+titulo+' — '+nomeObra+'</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}body{background:#07090f;color:#fff;font-family:Arial,sans-serif;overflow:hidden;height:100vh}\n.fr-wrap{position:relative;width:100%;height:calc(100vh - 110px);overflow:hidden}\n.fr{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s;z-index:1}\n.fr.on{opacity:1;z-index:2;animation:kb 8s ease-in-out forwards}\n@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1)}}\n.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 40%,rgba(0,0,0,.55) 100%)}\n.ovl{position:absolute;bottom:0;left:0;right:0;padding:20px 22px 16px;z-index:5;background:linear-gradient(transparent,rgba(0,0,0,.9))}\n.lbl{font-weight:700;font-size:.95rem}.dt{font-size:.72rem;color:#94a3b8;margin-top:3px}\n.pb-wrap{position:absolute;top:0;left:0;right:0;height:3px;z-index:6;background:rgba(255,255,255,.1)}\n.pb-fill{height:100%;background:'+cor+';width:0;transition:width linear}\n.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#07090f;flex-shrink:0;position:fixed;top:0;left:0;right:0;z-index:10}\n.hd-badge{background:rgba('+glow+',.15);border:1px solid rgba('+glow+',.35);border-radius:100px;padding:4px 14px;font-size:.7rem;font-weight:900;color:'+cor+';letter-spacing:2px}\n.ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#07090f;position:fixed;bottom:0;left:0;right:0}\n.pbtn{background:'+cor+';border:none;border-radius:10px;padding:9px 24px;font-weight:900;cursor:pointer;color:#000;font-size:.88rem}\n.nb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer}\n.cnt{font-size:.72rem;color:#4a5568;margin-left:auto}\n.logo-bar{display:flex;align-items:center;justify-content:center;padding:0 14px}\n.logo-bar img{height:22px;object-fit:contain;opacity:.6}\n</style>\n</head>\n<body>\n<div class="hd"><div class="hd-badge">'+m.icon+' '+titulo+'</div><div style="flex:1"></div><div style="font-size:.72rem;color:#4a5568">'+nomeObra+' · '+pct+'%</div></div>\n<div class="fr-wrap" style="margin-top:44px">\n<div class="pb-wrap"><div class="pb-fill" id="pf"></div></div>\n<div class="vignette"></div>\n'+imgsHTML+'\n<div class="ovl"><div class="lbl" id="lb"></div><div class="dt" id="dt"></div></div>\n</div>\n<div class="ctrl">\n<button class="pbtn" id="pbtn">▶ Play</button>\n<div style="display:flex;gap:6px"><button class="nb" onclick="prev()">‹</button><button class="nb" onclick="next()">›</button></div>\n<span class="cnt" id="cnt"></span>\n<div class="logo-bar"><img src="'+logo+'" alt="Logo"></div>\n</div>\n<script>\nvar caps=['+caps+'],dates=['+dates+'];\nvar imgs=document.querySelectorAll(".fr"),idx=0,playing=false,timer=null,vel=4200,total=imgs.length;\nvar pf=document.getElementById("pf");\nfunction show(i){imgs.forEach(function(im,j){im.className="fr"+(j===i?" on":"");});idx=i;document.getElementById("lb").textContent=caps[i]||"";document.getElementById("dt").textContent=dates[i]||"";document.getElementById("cnt").textContent=(i+1)+" / "+total;pf.style.transition="none";pf.style.width="0";setTimeout(function(){pf.style.transition="width "+vel+"ms linear";pf.style.width="100%";},50);}\nfunction next(){show((idx+1)%total);}function prev(){show((idx-1+total)%total);}\nvar pbtn=document.getElementById("pbtn");\nfunction startPlay(){playing=true;pbtn.textContent="⏸ Pausar";timer=setInterval(next,vel);}\nfunction stopPlay(){playing=false;pbtn.textContent="▶ Play";clearInterval(timer);}\npbtn.addEventListener("click",function(){if(playing)stopPlay();else startPlay();});\nshow(0);startPlay();\n<\/script>\n</body>\n</html>';
    // Baixar o arquivo HTML
    const blob=new Blob([page],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='marco-'+titulo.toLowerCase().replace(/[^a-z0-9]/g,'-')+'.html';
    a.click();
    // Salvar no DB.obras → Firebase para aparecer na aba Vídeos Salvos
    _salvarVideoFirebase(obraId,{
      id:'v'+Date.now(),
      etapaId:'', label:m.icon+' '+titulo,
      date:new Date().toLocaleDateString('pt-BR'),
      nome:'marco-'+marcoId+'.html', tipo:'text/html',
      origem:'cliente', ts:Date.now(), dados:page
    });
  }).catch(function(e){toast('⚠️ Erro ao gerar vídeo.',true);console.error(e);});
}
