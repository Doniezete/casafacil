let fotosSelecionadas = new Set();
let meuSsIdx=0, meuSsTimer=null, meuSsPlaying=false;
let _musicaCarregada = null; // {b64, type, label}

function buildVideoPersonalizado(){
  const el=document.getElementById('foto-sel-grid');
  if(!el||!obra) return;
  fotosSelecionadas.clear();
  const selCount=document.getElementById('sel-count');
  if(selCount) selCount.textContent='0';
  const player=document.getElementById('meu-video-player');
  if(player) player.style.display='none';
  _musicaCarregada=null;
  const musicLabel=document.getElementById('musica-label');
  if(musicLabel) musicLabel.textContent='Nenhuma música selecionada';

  // Agrupar fotos por etapa
  const grupos={}, ordem=[];
  obra.fotos.forEach(function(f,i){
    const eid=f.etapaId||'geral';
    if(!grupos[eid]){grupos[eid]=[];ordem.push(eid);}
    grupos[eid].push(i);
  });
  const etInfo={};
  obra.etapas.forEach(function(e){etInfo[e.id]={nome:e.nome,icon:e.icon||'🏗️'};});

  let out='';
  ordem.forEach(function(eid){
    const idxs=grupos[eid];
    const info=etInfo[eid]||{nome:'Geral',icon:'🏗️'};
    out+='<div style="margin-bottom:18px">';
    out+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
    out+='<div style="display:flex;align-items:center;gap:8px">';
    out+='<span style="font-size:1.1rem">'+info.icon+'</span>';
    out+='<span style="font-family:var(--fh);font-weight:800;font-size:.85rem">'+info.nome+'</span>';
    out+='<span style="font-size:.72rem;color:var(--tx3)">('+idxs.length+' foto'+(idxs.length!==1?'s':'')+')</span>';
    out+='</div>';
    out+='<button class="btn btn-s btn-sm" onclick="selecionarEtapa(\''+eid+'\')">Sel. etapa</button>';
    out+='</div>';
    out+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px">';
    idxs.forEach(function(i){
      const f=obra.fotos[i];
      out+='<div class="foto-sel-item" id="fsi-'+i+'" onclick="toggleFotoSel('+i+')">';
      out+='<img src="'+f.src+'" alt="'+f.label+'" loading="lazy">';
      out+='<div class="fsi-overlay"><div class="fsi-check">✓</div></div>';
      out+='<div class="fsi-label">'+f.label+'</div>';
      out+='</div>';
    });
    out+='</div></div>';
  });
  el.innerHTML=out||'<p style="color:var(--tx3);font-size:.82rem">Nenhuma foto disponível.</p>';
}

function toggleFotoSel(i){
  const el=document.getElementById('fsi-'+i);
  if(!el) return;
  if(fotosSelecionadas.has(i)){fotosSelecionadas.delete(i);el.classList.remove('sel');}
  else{fotosSelecionadas.add(i);el.classList.add('sel');}
  document.getElementById('sel-count').textContent=fotosSelecionadas.size;
}

function selecionarEtapa(eid){
  obra.fotos.forEach(function(f,i){
    if((f.etapaId||'geral')===eid){
      fotosSelecionadas.add(i);
      document.getElementById('fsi-'+i)?.classList.add('sel');
    }
  });
  document.getElementById('sel-count').textContent=fotosSelecionadas.size;
}

function selecionarTodasFotos(){
  obra.fotos.forEach(function(_,i){
    fotosSelecionadas.add(i);
    document.getElementById('fsi-'+i)?.classList.add('sel');
  });
  document.getElementById('sel-count').textContent=fotosSelecionadas.size;
}

function limparSelecaoFotos(){
  fotosSelecionadas.clear();
  document.querySelectorAll('.foto-sel-item.sel').forEach(function(el){el.classList.remove('sel');});
  document.getElementById('sel-count').textContent='0';
}

function carregarMusica(){
  const input=document.createElement('input');
  input.type='file'; input.accept='audio/*';
  input.onchange=function(){
    const file=input.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onloadend=function(){
      _musicaCarregada={b64:reader.result.split(',')[1],type:file.type||'audio/mpeg',label:file.name};
      const lbl=document.getElementById('musica-label');
      if(lbl) lbl.textContent='🎵 '+file.name;
      toast('✅ Música carregada: '+file.name);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function removerMusica(){
  _musicaCarregada=null;
  const lbl=document.getElementById('musica-label');
  if(lbl) lbl.textContent='Nenhuma música selecionada';
}

  fetch(m.url)

function toggleMeuSS(){

  const nomeExib=window._meuVideoNome||nomeObra;
  toast('⏳ Salvando vídeo...');
  function toBase64(src){

      return new Promise(function(res){var rd=new FileReader();rd.onloadend=function(){res(rd.result);};rd.readAsDataURL(b);});

function baixarMeuVideo(){
  const fotos=window._meuVideoFotos;
  if(!fotos||!fotos.length){toast('⚠️ Visualize o vídeo primeiro.',true);return;}
  const vel=(window._meuVideoVel||3)*1000;
  const trans=window._meuVideoTrans||'zoom';
  const nomeObra=obra?.nome?.split('–')[0]?.trim()||'obra';
  const nomeExib=window._meuVideoNome||'';
  toast('⏳ Preparando vídeo offline (embutindo fotos)...');

  // Converter todos os srcs para base64 para funcionar offline
  function toBase64(src){
    return fetch(src)
      .then(function(r){return r.blob();})
      .then(function(b){return new Promise(function(res){
        const rd=new FileReader();
        rd.onloadend=function(){res(rd.result);};
        rd.readAsDataURL(b);
      });})
      .catch(function(){return src;}); // fallback: URL original
  }

  Promise.all(fotos.map(function(f){return toBase64(f.src);}))
    .then(function(b64srcs){
      const fotosB64=fotos.map(function(f,i){
        return Object.assign({},f,{src:b64srcs[i]});
      });
      function gerar(audB64,audType){
        const pHTML=_montarHTMLVideo(fotosB64,nomeObra,nomeExib,vel,trans,audB64,audType);
        _dispararDownload(pHTML,nomeObra);
      }
      gerar('','');
    })
    .catch(function(e){
      toast('⚠️ Erro ao embutir fotos. Tente novamente.',true);
      console.error(e);
    });
}

function _dispararDownload(pageHTML,nomeObra){
  const blob=new Blob([pageHTML],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='evolucao-'+nomeObra.toLowerCase().replace(/[^a-z0-9]/g,'-')+'.html';
  a.click();
  toast('✅ Vídeo baixado! Abre em qualquer navegador — celular ou PC.');
}

// Checar marcos ao salvar progresso
function verificarMarcoVideo(obraId){
  const o=DB.obras[obraId];
  if(!o||!o.fotos||o.fotos.length<3) return;
  const pct=Math.round(o.etapas.reduce(function(s,e){return s+(e.pct||0);},0)/Math.max(o.etapas.length,1));
  if(!o._marcosVideo) o._marcosVideo=[];
  let novoMarco=false;
  [30,60,85,100].forEach(function(m){
    if(pct>=m&&!o._marcosVideo.includes(m)){
      o._marcosVideo.push(m);
      novoMarco=true;
    }
  });
  if(novoMarco){
    DB.obras[obraId]=o;
    _syncDB();
    // Atualizar badge na aba c-video se o cliente estiver logado
    if(role==='cliente'&&obraId===obraId){
      _atualizarBadgeVideo();
    }
  }
}

// ── UPDATE CLIENT INFO NO UPLOAD ──
function updateAfClienteInfo(){
  const id=document.getElementById('af-obra')?.value;
  if(!id)return;
  const o=DB.obras[id];
  const c=Object.entries(DB.clients).find(([,cl])=>cl.obraId===id);
  const el=document.getElementById('af-cliente-info');
  if(!el)return;
  const pct=Math.round(o.etapas.reduce((s,e)=>s+e.pct,0)/o.etapas.length);
  el.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="width:36px;height:36px;border-radius:50%;background:${c?c[1].color:'var(--acc)'};display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:900;font-size:.82rem;color:#000;flex-shrink:0">${c?c[1].initials:'??'}</div>
    <div>
      <div style="font-weight:700;font-size:.85rem">${c?c[1].name:'Cliente não encontrado'}</div>
      <div style="font-size:.72rem;color:var(--tx3)">${o.nome} · Progresso: ${pct}% · ${o.fotos.length} foto(s) registradas</div>
    </div>
  </div>`;
  renderFotosExistentes();
}

function renderFotosExistentes(){
  const id=document.getElementById('af-obra')?.value;
  const el=document.getElementById('af-fotos-existentes');
  if(!id||!el)return;
  const o=DB.obras[id];
  if(!o||!o.fotos||!o.fotos.length){
    el.innerHTML='<div style="font-size:.8rem;color:var(--tx3);padding:10px 0">Nenhuma foto enviada ainda para essa obra.</div>';
    return;
  }
  // Mostrar as mais recentes primeiro
  const ordenadas = o.fotos.map((f,i)=>({...f,_idx:i})).sort((a,b)=>(b.ts||0)-(a.ts||0));
  el.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">'+
    ordenadas.map(f=>`<div style="position:relative">
      <img src="${f.src}" style="width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)">
      <div style="font-size:.66rem;color:var(--tx3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.label||''}</div>
      <button type="button" onclick="excluirFotoObra('${id}',${f._idx})" title="Excluir esta foto"
        style="position:absolute;top:4px;right:4px;background:rgba(239,68,68,.85);border:none;color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:.8rem;line-height:1">✕</button>
    </div>`).join('')+
  '</div>';
}

function excluirFotoObra(oId, idx){
  const o=DB.obras[oId];
  if(!o||!o.fotos||!o.fotos[idx])return;
  if(!confirm('Excluir esta foto? Ela vai sumir do portal do cliente também.'))return;
  o.fotos.splice(idx,1);
  renderFotosExistentes();
  updateAfClienteInfo();
  _syncDB();
  toast('🗑️ Foto excluída.');
}

function buildSlideshow(fotosAll){
  if(!fotosAll||!fotosAll.length) return '<div class="card"><div class="empty"><div class="ei">📸</div><p>Nenhuma foto adicionada ainda. As fotos aparecerão aqui quando o responsável as adicionar.</p></div></div>';

  // Agrupar por etapa
  const grupos = {};
  const ordemEtapas = [];
  fotosAll.forEach(function(f){
    const eid = f.etapaId || 'geral';
    if(!grupos[eid]){ grupos[eid]=[]; ordemEtapas.push(eid); }
    grupos[eid].push(f);
  });

  // Encontrar nome/icon de cada etapa pelo DB
  const etapasInfo = {};
  if(obra && obra.etapas){
    obra.etapas.forEach(function(e){ etapasInfo[e.id]={nome:e.nome,icon:e.icon||'🏗️'}; });
  }

  let html = '<div class="ph"><div><h1>Fotos da Obra</h1><p>'+fotosAll.length+' foto'+(fotosAll.length!==1?'s':'')+' registrada'+(fotosAll.length!==1?'s':'')+'</p></div></div>';

  ordemEtapas.forEach(function(eid){
    const fotos = grupos[eid];
    const info = etapasInfo[eid] || {nome:'Geral', icon:'🏗️'};

    html += '<div class="card" style="margin-bottom:14px">';
    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">';
    html += '<span style="font-size:1.4rem">'+info.icon+'</span>';
    html += '<div><div style="font-family:var(--fh);font-weight:900;font-size:.95rem">'+info.nome+'</div>';
    html += '<div style="font-size:.72rem;color:var(--tx3)">'+fotos.length+' foto'+(fotos.length!==1?'s':'')+'</div></div></div>';

    // Grid de fotos
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">';
    fotos.forEach(function(f,i){
      const allIdx = fotosAll.indexOf(f);
      html += '<div onclick="abrirFoto('+allIdx+')" style="cursor:pointer;border-radius:9px;overflow:hidden;aspect-ratio:4/3;background:var(--s2);position:relative">';
      html += '<img src="'+f.src+'" alt="'+f.label+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s" onmouseover="this.style.transform=\'scale(1.04)\'" onmouseout="this.style.transform=\'none\'">';
      html += '<div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:6px 8px">';
      html += '<div style="font-size:.68rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+f.label+'</div>';
      html += '<div style="font-size:.6rem;color:#94a3b8">'+f.date+'</div>';
      html += '</div></div>';
    });
    html += '</div></div>';
  });

  return html;
}

function abrirFoto(idx){
  const fotos = obra ? obra.fotos : [];
  if(!fotos.length) return;
  let cur = idx;
  function mostrar(i){
    cur = (i+fotos.length)%fotos.length;
    const f = fotos[cur];
    openMo(
      f.label+' <span style="font-size:.72rem;color:var(--tx3)">'+f.date+'</span>',
      '<img src="'+f.src+'" style="width:100%;max-height:70vh;object-fit:contain;border-radius:8px">',
      '<button class="btn btn-s btn-sm" onclick="abrirFoto('+(cur-1)+')">‹ Anterior</button>'
      +'<button class="btn btn-s btn-sm" onclick="abrirFoto('+(cur+1)+')">Próxima ›</button>'
      +'<button class="btn btn-s btn-sm" onclick="baixarFotoAtual()">⬇️ Baixar foto</button>'
    );
  }
  mostrar(cur);
}

function baixarFotoAtual(){
  const img = document.querySelector('#mo-body img');
  if(!img) return;
  const src = img.src;
  const label = document.getElementById('mo-title')?.textContent || 'foto';
  fetch(src)
    .then(function(r){return r.blob();})
    .then(function(blob){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=label.replace(/[^a-z0-9]/gi,'-').slice(0,40)+'.jpg';
      a.click();
      toast('✅ Foto salva!');
    })
    .catch(function(){
      window.open(src,'_blank');
      toast('💡 Foto aberta em nova aba — segure a imagem para salvar no celular.');
    });
}

function getFotosFiltradas(fotosAll){
  let fotos = [...fotosAll];
  const ordem = document.getElementById('cfg-ordem')?.value || ssConfig.ordem;
  const qtd = parseInt(document.getElementById('cfg-qtd')?.value) || fotosAll.length;
  if(ordem==='crono') fotos.sort((a,b)=>a.ts-b.ts);
  else if(ordem==='recente') fotos.sort((a,b)=>b.ts-a.ts);
  else if(ordem==='etapa') fotos.sort((a,b)=>(a.etapaId||'').localeCompare(b.etapaId||''));
  return fotos.slice(0, Math.min(qtd, fotos.length));
}

function buildSsInner(fotosAll){
  const fotos = getFotosFiltradas(fotosAll);
  const trans = document.getElementById('cfg-trans')?.value || ssConfig.transicao;

function initSS(){ssIdx=0;ssPlaying=false;const b=document.getElementById('ss-play');if(b){b.textContent='▶ Play';b.classList.remove('playing');}clearInterval(ssTimer);}

function getSsFotos(){ return obra ? getFotosFiltradas(obra.fotos) : []; }

function goSS(n){
  const fotos=getSsFotos();if(!fotos.length)return;
  const imgs=document.querySelectorAll('.ss-img');
  const dots=document.querySelectorAll('#ss-dots .ss-dot');
  imgs.forEach((img,i)=>img.classList.toggle('on',i===n));
  dots.forEach((d,i)=>d.classList.toggle('on',i===n));
  ssIdx=n;
  const cap=document.getElementById('ss-cap'),sub=document.getElementById('ss-sub'),cnt=document.getElementById('ss-cnt');
  if(cap)cap.textContent=fotos[n].label;
  if(sub)sub.textContent=fotos[n].date+' · foto '+(n+1)+' de '+fotos.length;
  if(cnt)cnt.textContent=(n+1)+' / '+fotos.length;
}
function nextSS(){const f=getSsFotos();goSS((ssIdx+1)%Math.max(f.length,1));}
function prevSS(){const f=getSsFotos();goSS((ssIdx-1+f.length)%Math.max(f.length,1));}
function toggleSS(){
  ssPlaying=!ssPlaying;
  const b=document.getElementById('ss-play');
  const b2=document.getElementById('ss-play-cfg');
  const ms=(ssConfig.velocidade||3)*1000;
  if(ssPlaying){
    if(b){b.textContent='⏸ Pausar';b.classList.add('playing');}
    if(b2){b2.textContent='⏸ Pausar';b2.classList.add('playing');}
    ssTimer=setInterval(nextSS,ms);
  } else {
    if(b){b.textContent='▶ Play';b.classList.remove('playing');}
    if(b2){b2.textContent='▶ Play';b2.classList.remove('playing');}
    clearInterval(ssTimer);
  }
}

let _syncData = null;

async function syncDoFirestore(){
  const login=document.getElementById('sync-login')?.value.trim().toLowerCase();
  const res=document.getElementById('sync-resultado');
  if(!login){toast('⚠️ Digite o login do cliente.',true);return;}
  if(!_fbReady){toast('⚠️ Firebase não conectado.',true);return;}
  if(res) res.innerHTML='<div style="color:var(--tx3);font-size:.83rem">🔄 Buscando dados na nuvem...</div>';
  try {
    const doc=await _db.collection('obraviva').doc(login).get();
    if(!doc.exists){
      if(res) res.innerHTML='<div class="al al-r"><div class="ai">❌</div><div><div class="at">Não encontrado</div><div class="as">Nenhuma obra exportada para o login "'+login+'". Verifique o nome no CasaFácil e exporte novamente.</div></div></div>';
      return;
    }
    _syncData=doc.data();
    const dt=_syncData._exportDate?new Date(_syncData._exportDate).toLocaleString('pt-BR'):'—';
    if(res) res.innerHTML=
      '<div class="al al-g" style="margin-bottom:10px"><div class="ai">✅</div><div>'
      +'<div class="at">Obra encontrada: '+(_syncData.clienteNome||login)+'</div>'
      +'<div class="as">Exportado em '+dt+'</div>'
      +'</div></div>'
      +'<div style="display:flex;gap:8px;margin-top:8px">'
      +'<button class="btn btn-g btn-sm" onclick="aplicarImportacao(_syncData)">✅ Aplicar a obra existente</button>'
      +'<button class="btn btn-a btn-sm" onclick="criarClienteImportado(_syncData)">➕ Criar novo cliente</button>'
      +'</div>';
  } catch(err){
    if(res) res.innerHTML='<div class="al al-r"><div class="ai">❌</div><div><div class="at">Erro ao buscar</div><div class="as">'+err.message+'</div></div></div>';
    console.error('syncDoFirestore:',err);
  }
}

function confirmarImportacao(data){
  const id=document.getElementById('imp-obra').value;
  const o=DB.obras[id];if(!o)return;
  // Dados básicos da obra
  if(data.nome||data.nomeObra) o.nome=data.nome||data.nomeObra;
  if(data.endereco||data.bairro) o.bairro=data.endereco||data.bairro||o.bairro;
  if(data.inicio) o.inicio=data.inicio;
  if(data.previsaoEntrega) o.previsao=data.previsaoEntrega;
  if(data.totalContrato) o.totalContrato=data.totalContrato;
  // Engenheiro
  if(data.engNome) o.engNome=data.engNome;
  if(data.engCrea) o.engCrea=data.engCrea;
  if(data.engTel) o.engTel=data.engTel;
  if(data.engEmail) o.engEmail=data.engEmail;
  // Admin
  if(data.admTel) o.admTel=data.admTel;
  if(data.admEmail) o.admEmail=data.admEmail;
  // Dados pessoais do cliente (para contrato)
  if(data.clienteCpf) o._clienteCpf=data.clienteCpf;
  if(data.clienteRg) o._clienteRg=data.clienteRg;
  if(data.clienteTel){
    const c=Object.entries(DB.clients).find(([,cl])=>cl.obraId===id);
    if(c)c[1].tel=data.clienteTel;
  }
  // Etapas — substituição completa ou atualização
  if(data.etapas&&data.etapas.length){
    if(data.etapas.length===o.etapas.length){
      data.etapas.forEach((ei,i)=>{
        const et=o.etapas[i];
        if(ei.nome)et.nome=ei.nome;
        if(ei.icon)et.icon=ei.icon;
        if(ei.pct!==undefined)et.pct=ei.pct;
        if(ei.status)et.status=ei.status;
        if(ei.previsto)et.previsto=ei.previsto;
        if(ei.pago){et.pago=ei.pago;et.pct=100;et.status='done';}
        if(ei.dataPag)et.dataPag=ei.dataPag;
        if(ei.desc)et.desc=ei.desc;
        if(ei.itens&&ei.itens.length)et.itens=ei.itens;
        if(ei.v30)et.v30=ei.v30;
        if(ei.v85)et.v85=ei.v85;
      });
    } else {
      // Quantidade diferente: substituir todas
      o.etapas=data.etapas.map((ei,i)=>({
        id:'e'+(i+1),
        icon:ei.icon||'🔧',nome:ei.nome||'Etapa '+(i+1),
        pct:ei.pct||0,status:ei.status||'pending',
        previsto:ei.previsto||0,pago:ei.pago||null,dataPag:ei.dataPag||null,
        v30:ei.v30||'⏳ Aguardando',v85:ei.v85||'⏳ Aguardando',
        desc:ei.desc||'',itens:ei.itens||[],aviso:ei.aviso||''
      }));
    }
  }
  o.totalPago=o.etapas.reduce((s,e)=>s+(e.pago||0),0);
  if(data.atualizacoes&&data.atualizacoes.length)
    o.atualizacoes=[...data.atualizacoes,...o.atualizacoes].slice(0,20);
  o.atualizacoes.unshift({data:new Date().toLocaleDateString('pt-BR'),titulo:'🔗 Dados sincronizados do CasaFácil',desc:'Importação realizada com sucesso.',dot:'done'});
  o.ultimaAtt=new Date().toLocaleDateString('pt-BR');
  closeMo();renderAdminObras();renderAdminFin();renderAdminDashObras();
  if(role==='cliente'&&obraId===id){obra=DB.obras[id];buildClientPages();buildVideoPersonalizado();}
  toast('✅ Dados importados! '+o.etapas.length+' etapas, '+R(o.totalContrato));
}

function criarClienteImportado(data){
  // Cria novo cliente/obra a partir dos dados do CasaFácil
  const nomeCliente=data.clienteNome||data.nome||'Novo Cliente';
  const loginBase=(nomeCliente.split(' ')[0]||'cliente').toLowerCase().replace(/[^a-z]/g,'');
  let login=loginBase; let n=2;
  while(DB.clients[login]){login=loginBase+n;n++;}
  const id='ob'+Date.now();
  const cores=['#f59e0b','#3b82f6','#22c55e','#8b5cf6','#f97316','#14b8a6'];
  const color=cores[Object.keys(DB.clients).length%cores.length];
  const initials=nomeCliente.split(' ').slice(0,2).map(n=>n[0]||'?').join('').toUpperCase();
  const total=data.totalContrato||120000;
  const pcts=[17,28,21,17,17];
  const etapas=(data.etapas&&data.etapas.length)?
    data.etapas.map((ei,i)=>({
      id:'e'+(i+1),icon:ei.icon||['🏗️','🏛️','🧱','⚡','✨'][i]||'🔧',
      nome:ei.nome||'Etapa '+(i+1),pct:ei.pct||0,status:ei.status||'pending',
      previsto:ei.previsto||Math.round(total*pcts[i%5]/100),
      pago:ei.pago||null,dataPag:ei.dataPag||null,
      v30:ei.v30||'⏳ Aguardando',v85:ei.v85||'⏳ Aguardando',
      desc:ei.desc||'',itens:ei.itens||[],aviso:ei.aviso||''
    })):
    ['🏗️ Fundação','🏛️ Estrutura','🧱 Alvenaria','⚡ Instalações','✨ Acabamentos'].map((nm,i)=>{
      const [icon,...rest]=nm.split(' ');
      return{id:'e'+(i+1),icon,nome:rest.join(' '),pct:0,status:'pending',
        previsto:Math.round(total*pcts[i]/100),pago:null,dataPag:null,
        v30:'⏳ Aguardando',v85:'⏳ Aguardando',desc:'',itens:[],aviso:''};
    });
  DB.clients[login]={pw:(function(){var c='abcdefghjkmnpqrstuvwxyz23456789';var s='';for(var i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s;})(),name:nomeCliente,initials,color,obraId:id,
    tel:data.clienteTel||'',email:data.clienteEmail||''};
  DB.obras[id]={
    nome:data.nomeObra||data.nome||'Res. Nova – Lote 01',
    bairro:data.endereco||data.bairro||'—',
    engNome:data.engNome||'—',engCrea:data.engCrea||'',
    engTel:data.engTel||'',engEmail:data.engEmail||'',
    admTel:data.admTel||'',admEmail:data.admEmail||'',
    inicio:data.inicio||new Date().toLocaleDateString('pt-BR'),
    previsao:data.previsaoEntrega||'—',
    totalContrato:total,totalPago:0,
    ultimaAtt:new Date().toLocaleDateString('pt-BR'),
    etapas,fotos:[],dicas:[],
    _clienteCpf:data.clienteCpf||'',_clienteRg:data.clienteRg||'',
    atualizacoes:[{data:new Date().toLocaleDateString('pt-BR'),titulo:'🔗 Obra importada do CasaFácil',desc:'Cliente e obra criados automaticamente.',dot:'done'}]
  };
  closeMo();buildAdminPages();
  toast('✅ Cliente "'+nomeCliente+'" criado! Login: '+login+' · Senha: '+DB.clients[login].pw);
}

// SISTEMA DE VÍDEOS — IndexedDB (armazena localmente)
// ═══════════════════════════════════════════════════
let _idb = null;
function _abrirIDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open('casafacil-videos',1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('videos')){
        const st = db.createObjectStore('videos',{keyPath:'id',autoIncrement:true});
        st.createIndex('obraId','obraId',{unique:false});
      }
    };
    req.onsuccess = e => { _idb=e.target.result; res(_idb); };
    req.onerror = e => rej(e);
  });
}
function _idbTx(mode){ return _idb.transaction('videos',mode).objectStore('videos'); }

function _salvarVideoIDB(video){
  return _abrirIDB().then(()=>new Promise((res,rej)=>{
    const req=_idbTx('readwrite').add(video);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=rej;
  }));
}
function _listarVideosIDB(obraId){
  return _abrirIDB().then(()=>new Promise((res,rej)=>{
    const idx=_idb.transaction('videos','readonly').objectStore('videos').index('obraId');
    const req=idx.getAll(obraId);
    req.onsuccess=e=>res(e.target.result||[]);
    req.onerror=rej;
  }));
}
function _deletarVideoIDB(id){
  return _abrirIDB().then(()=>new Promise((res,rej)=>{
    const req=_idbTx('readwrite').delete(id);
    req.onsuccess=res; req.onerror=rej;
  }));
}

function _getYtId(url){
  if(!url) return '';
  const m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/);
  return m?m[1]:'';
}

  const ytId=_getYtId(url);
  if(ytId){
    ifr.src='https://www.youtube.com/embed/'+ytId;
    prev.style.display='block';
  } else {
    prev.style.display='none';
    ifr.src='';

}

function confirmarVideo(){
  if(!_videoFile){toast('⚠️ Nenhum vídeo selecionado.',true);return;}
  const oId=document.getElementById('av-obra')?.value;
  const etId=document.getElementById('av-etapa')?.value;
  const label=document.getElementById('av-label')?.value.trim()||'Vídeo da obra';
  const date=document.getElementById('av-date')?.value.trim()||'—';
  if(!oId){toast('⚠️ Selecione uma obra.',true);return;}
  if(!_fbReady||!_storage){toast('⚠️ Firebase não conectado. Aguarde.',true);return;}
  const btn=document.getElementById('av-btn-salvar');
  const wrap=document.getElementById('av-progress-wrap');
  const bar=document.getElementById('av-progress-bar');
  const pct=document.getElementById('av-progress-pct');
  if(btn){btn.disabled=true;btn.textContent='⏳ Enviando...';}
  if(wrap) wrap.style.display='block';
  toast('⏳ Enviando vídeo...');
  // Upload para Firebase Storage
  const ext=_videoFile.name.split('.').pop()||'mp4';
  const path='videos/'+oId+'/'+Date.now()+'.'+ext;
  const ref=_storage.ref(path);
  const task=ref.put(_videoFile);
  task.on('state_changed',
    function(snap){
      const p=Math.round(snap.bytesTransferred/snap.totalBytes*100);
      if(bar) bar.style.width=p+'%';
      if(pct) pct.textContent=p+'%';
    },
    function(err){
      console.error('Storage error:',err);
      toast('❌ Erro no upload: '+err.message,true);
      if(btn){btn.disabled=false;btn.textContent='✅ Salvar vídeo para o cliente';}
      if(wrap) wrap.style.display='none';
    },
    async function(){
      const url=await ref.getDownloadURL();
      const videoObj={
        id:'v'+Date.now(),
        etapaId:etId||'', label, date,
        nome:_videoFile.name, tipo:_videoFile.type||'video/mp4',
        origem:'admin', ts:Date.now(),
        dados:url,
        storagePath:path
      };
      const o=DB.obras[oId];
      if(!o){if(btn){btn.disabled=false;btn.textContent='✅ Salvar vídeo para o cliente';}return;}
      if(!o.videos) o.videos=[];
      o.videos.push(videoObj);
      DB.obras[oId]=o;
      // Salvar metadados (só a URL, não o arquivo) no Firestore
      try{
        const existing=await _db.collection('portal_videos').doc(oId).get();
        let lista=[];
        if(existing.exists){try{lista=JSON.parse(existing.data().videos||'[]');}catch(e2){}}
        lista.push(videoObj);
        await _db.collection('portal_videos').doc(oId).set({
          videos:JSON.stringify(lista),
          atualizado:firebase.firestore.FieldValue.serverTimestamp()
        });
        toast('✅ Vídeo enviado! O cliente já pode assistir na aba Vídeos Salvos.');
      }catch(err2){
        console.warn('Firestore portal_videos error:',err2);
        toast('✅ Vídeo enviado com sucesso!');
      }
      // Sincronizar documento principal também (garante que cliente vê mesmo sem portal_videos)
      _syncDB();
      cancelarVideo();
      if(btn){btn.disabled=false;btn.textContent='✅ Salvar vídeo para o cliente';}
      if(wrap) wrap.style.display='none';
    }
  );
}// ── Listagem de vídeos (cliente) ──

function _baixarVideoSalvo(videoId){
  const o=DB.obras[obraId];
  const v=(o&&o.videos||[]).find(function(x){return x.id===videoId;});
  if(!v){toast('⚠️ Vídeo não encontrado.',true);return;}
  const isHTML=v.tipo==='text/html'||v.nome?.endsWith('.html');
  const ext=isHTML?'.html':'.mp4';
  const nome=(v.label||'video').replace(/[^a-zA-Z0-9\- ]/g,'').trim()+ext;
  if(isHTML){
    // dados é string HTML
    const blob=new Blob([v.dados],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=nome; a.click();
    setTimeout(function(){URL.revokeObjectURL(url);},5000);
  } else {
    // dados é base64 data URL
    const a=document.createElement('a');
    a.href=v.dados; a.download=nome; a.click();
  }
}

function _abrirVideoHTML(videoId){
  const o=DB.obras[obraId];
  const v=(o&&o.videos||[]).find(function(x){return x.id===videoId;});
  if(!v){toast('⚠️ Vídeo não encontrado.',true);return;}
  const blob=new Blob([v.dados],{type:'text/html;charset=utf-8'});

  const win=window.open(url,'_blank');
  if(!win) toast('⚠️ Permite pop-ups no navegador para abrir o vídeo.',true);
  setTimeout(function(){URL.revokeObjectURL(url);},30000);
}

function docEnviar2(){
  var titulo = ((document.getElementById('doc-titulo2')||{}).value||'').trim();
  var cliente = (document.getElementById('doc-cliente2')||{}).value||'';
  if(!titulo) return toast('Informe o título do documento.',true);
  if(!window._docFile2Data) return toast('Selecione um arquivo.',true);
  if(!DB.documentos) DB.documentos = [];
  if(!_fbReady||!_db) return toast('Sem conexão com Firebase.',true);

  var clienteObraId = cliente && DB.clients[cliente] ? DB.clients[cliente].obraId : '';
  var docId = 'doc_'+Date.now();
  var storage = firebase.storage();
  var fileData = window._docFile2Data;

  // Limpar form imediatamente
  window._docFile2Data = null;
  document.getElementById('doc-titulo2').value='';
  document.getElementById('doc-file-name2').textContent='';
  document.getElementById('doc-file2').value='';
  toast('⏳ Enviando arquivo...');

  // Fazer upload para Firebase Storage
  var storageRef = storage.ref('documentos/' + docId + '_' + fileData.name);
  
  // Converter base64 para blob
  var base64Data = fileData.b64.split(',')[1] || fileData.b64;
  var byteChars = atob(base64Data);
  var byteNums = new Array(byteChars.length);
  for(var i=0; i<byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
  var blob = new Blob([new Uint8Array(byteNums)], {type: fileData.type});

  storageRef.put(blob).then(function(snapshot){
    return snapshot.ref.getDownloadURL();
  }).then(function(url){
    // Salvar metadados + URL no Firestore (sem base64!)
    var novoDoc = {
      id: docId,
      titulo: titulo,
      nome: fileData.name,
      type: fileData.type,
      url: url,        // URL do Storage em vez de base64
      b64: '',         // vazio para não estourar limite
      data: new Date().toLocaleDateString('pt-BR'),
      ts: Date.now(),
      para: cliente,
      paraObraId: clienteObraId
    };
    DB.documentos.push(novoDoc);
    return _db.collection('portal').doc('documentos').set({
      lista: JSON.stringify(DB.documentos),
      solicitacoes: JSON.stringify(DB.solicitacoesExclusao||[]),
      atualizado: firebase.firestore.FieldValue.serverTimestamp()
    });
  }).then(function(){
    renderAdminDocs2();
    toast('✅ Documento enviado com sucesso!');
  }).catch(function(e){
    toast('❌ Erro ao enviar: '+e.message, true);
    console.error('docEnviar2:', e);
  });
}

      +'<div style="font-size:.73rem;color:var(--tx3);margin-top:2px">'+d.nome+' · Enviado em '+d.data+'</div></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
      +(isCaixa?'<button style="background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.4);border-radius:8px;padding:8px 14px;font-weight:700;font-size:.82rem;cursor:pointer" id="csim_'+d.id+'">🏦 Usar no Simulador</button>':'')

// ── SOLICITAÇÕES DE EXCLUSÃO DE DOCUMENTOS ───────────────────────────────────

function solicitarExclusaoDoc(docId, titulo){
  if(!confirm('Solicitar exclusão de "'+titulo+'"?\n\nO administrador será notificado e precisará aprovar.')) return;
  if(!DB.solicitacoesExclusao) DB.solicitacoesExclusao = [];
  // Evitar duplicata
  var jaExiste = DB.solicitacoesExclusao.some(function(s){ return s.docId===docId && s.status==='pendente'; });
  if(jaExiste){ toast('⏳ Solicitação já enviada. Aguarde aprovação.',true); return; }
  DB.solicitacoesExclusao.push({
    id:      'sex_'+Date.now(),
    docId:   docId,
    titulo:  titulo,
    login:   window._clienteLogin||'',
    data:    new Date().toLocaleDateString('pt-BR'),
    ts:      Date.now(),
    status:  'pendente'
  });
  _syncDB();
  renderDocumentosCliente();
  toast('✅ Solicitação enviada! O administrador irá analisar.');
}

function aprovarExclusaoDoc(solId){
  const sol = (DB.solicitacoesExclusao||[]).find(function(s){ return s.id===solId; });
  if(!sol) return;
  if(!confirm('Aprovar exclusão de "'+sol.titulo+'"?\nO documento será removido permanentemente.')) return;
  // Remover da memória
  DB.documentos = (DB.documentos||[]).filter(function(d){ return d.id!==sol.docId; });
  DB.solicitacoesExclusao = (DB.solicitacoesExclusao||[]).filter(function(s){ return s.id!==solId; });
  // Salvar diretamente no Firebase e só depois re-renderizar
  if(_fbReady && _db){
    _db.collection('portal').doc('documentos').set({
      lista: JSON.stringify(DB.documentos),
      solicitacoes: JSON.stringify(DB.solicitacoesExclusao),
      atualizado: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      renderAdminDocs();
      toast('✅ Documento excluído com sucesso!');
    }).catch(function(e){
      toast('❌ Erro ao salvar: '+e.message, true);
    });
  } else {
    _syncDB();
    setTimeout(function(){ renderAdminDocs(); }, 1000);
    toast('✅ Documento excluído!');
  }
}

function recusarExclusaoDoc(solId){
  const sol = (DB.solicitacoesExclusao||[]).find(function(s){ return s.id===solId; });
  if(!sol) return;
  if(!confirm('Recusar solicitação de "'+sol.titulo+'"?\nO documento será mantido.')) return;
  DB.solicitacoesExclusao = (DB.solicitacoesExclusao||[]).filter(function(s){ return s.id!==solId; });
  if(_fbReady && _db){
    _db.collection('portal').doc('documentos').set({
      lista: JSON.stringify(DB.documentos),
      solicitacoes: JSON.stringify(DB.solicitacoesExclusao),
      atualizado: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      renderAdminDocs();
      toast('Solicitação recusada. Documento mantido.');
    });
  } else {
    _syncDB();
    setTimeout(function(){ renderAdminDocs(); }, 1000);
  }
}

function _docIcon(type){
  if(!type) return '📄';
  if(type.includes('pdf')) return '📕';
  if(type.includes('image')) return '🖼️';
  if(type.includes('word') || type.includes('document')) return '📝';
  if(type.includes('sheet') || type.includes('excel')) return '📊';
  return '📎';
}

function abrirDocById(id){return abrirDoc(id);}
function abrirDoc(id){
  const d = (DB.documentos||[]).find(function(x){return x.id===id;});
  if(!d) return;
  // Usar URL do Storage se disponível
  if(d.url){ window.open(d.url,'_blank'); return; }
  const w = window.open('','_blank');
  if(d.type && d.type.startsWith('image/')){
    w.document.write('<html><body style="margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh"><img src="'+d.b64+'" style="max-width:100%;max-height:100vh;object-fit:contain"></body></html>');
  } else {
    w.document.write('<html><head><style>body{margin:0;padding:0}iframe{width:100vw;height:100vh;border:none}</style></head><body><iframe src="'+d.b64+'"></iframe></body></html>');
  }
  w.document.close();
}

function baixarDoc(id){
  const d = (DB.documentos||[]).find(function(x){return x.id===id;});
  if(!d) return;
  if(d.url){ const a=document.createElement('a');a.href=d.url;a.target='_blank';a.download=d.nome||d.titulo;a.click();return; }
  const a = document.createElement('a');
  a.href = d.b64;
  a.download = d.nome || d.titulo;
  a.click();
  toast('⬇️ Baixando '+d.titulo+'...');
}

function excluirDoc(id){
  if(!confirm('Remover este documento?')) return;
  var doc = (DB.documentos||[]).find(function(d){return d.id===id;});
  DB.documentos = (DB.documentos||[]).filter(function(d){return d.id!==id;});
  // Deletar do Storage se tiver URL
  if(doc && doc.url && _fbReady){
    try{ firebase.storage().refFromURL(doc.url).delete().catch(function(){}); }catch(e){}
  }
  if(_fbReady && _db){
    _db.collection('portal').doc('documentos').set({
      lista: JSON.stringify(DB.documentos),
      solicitacoes: JSON.stringify(DB.solicitacoesExclusao||[]),
      atualizado: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){ renderAdminDocs(); renderAdminDocs2(); toast('🗑 Documento removido.'); });
  } else {
    _syncDB(); renderAdminDocs(); toast('🗑 Documento removido.');
  }
}

async function _syncFotosObraSubcolecao(oId){
  if(!_db) return;
  const o = DB.obras[oId];
  if(!o) return;
  // Compatibilidade: fotos salvas antes dessa mudança podem não ter "id" — atribuir agora
  (o.fotos||[]).forEach(function(f,i){
    if(!f.id) f.id = 'f'+(f.ts||Date.now())+'_'+i;
  });
  const fotos = (o.fotos||[]).filter(function(f){return f.id;});
  const colRef = _db.collection('portal_fotos_obra').doc(oId).collection('itens');
  const snap = await colRef.get();
  const idsAtuais = new Set(fotos.map(function(f){return f.id;}));
  const batch = _db.batch();
  let temOperacao = false;
  snap.forEach(function(doc){
    if(!idsAtuais.has(doc.id)){ batch.delete(doc.ref); temOperacao=true; }
  });
  fotos.forEach(function(f){
    batch.set(colRef.doc(f.id), f);
    temOperacao = true;
  });
  if(temOperacao) await batch.commit();
}

async function _carregarFotosObraSubcolecao(oId){
  if(!_db||!oId) return [];
  try{
    const snap = await _db.collection('portal_fotos_obra').doc(oId).collection('itens').get();
    const fotos = [];
    snap.forEach(function(doc){ fotos.push(doc.data()); });
    fotos.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
    return fotos;
  }catch(e){
    console.warn('[portal] Erro ao carregar fotos da subcoleção:', e);
    return [];
  }
}

function _syncDB(){
  if(!_fbReady) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async ()=>{
    _showSync('saving');
    try {
      // Fotos ficam em coleção própria (uma foto = um registro), para não estourar
      // o limite de tamanho de documento do Firestore quando há muitas fotos.
      // Por isso, tiramos "fotos" do JSON principal antes de salvar.
      const obrasSemFotos = {};
      Object.keys(DB.obras).forEach(function(k){
        const copia = Object.assign({}, DB.obras[k]);
        delete copia.fotos;
        obrasSemFotos[k] = copia;
      });
      await _db.collection('portal').doc('dados').set({
        clients: JSON.stringify(DB.clients),
        obras: JSON.stringify(obrasSemFotos),
        atualizado: firebase.firestore.FieldValue.serverTimestamp()
      });
      // Salvar documentos em coleção separada (podem ser grandes por causa do base64)
      if(DB.documentos && DB.documentos.length){
        await _db.collection('portal').doc('documentos').set({
          lista: JSON.stringify(DB.documentos),
          solicitacoes: JSON.stringify(DB.solicitacoesExclusao||[]),
          atualizado: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      // Salvar também em portal_videos como backup por obra
      const saves=[];
      Object.keys(DB.obras).forEach(function(k){
        const o=DB.obras[k];
        if(o.videos&&o.videos.length){
          saves.push(_db.collection('portal_videos').doc(k).set({
            videos: JSON.stringify(o.videos),
            atualizado: firebase.firestore.FieldValue.serverTimestamp()
          }));
        }
        // Sincronizar fotos dessa obra (uma foto = um documento na subcoleção)
        saves.push(_syncFotosObraSubcolecao(k));
      });
      if(saves.length) await Promise.all(saves);
      _showSync('ok');
    } catch(e){
      console.error('Sync error:',e);
      _showSync('err');
      const msg = (e && (e.message||e.code)) || 'desconhecido';
      toast('❌ Erro ao salvar na nuvem: '+msg, true);
      alert('⚠️ ERRO AO SALVAR NA NUVEM\n\nAs últimas alterações (fotos, dados, etc.) NÃO foram salvas de verdade.\n\nDetalhe técnico: '+msg);
    }
  }, 1000);
}

async function _carregarDados(){
  _showSync('load');
  try {
    const doc = await _db.collection('portal').doc('dados').get();
    if(doc.exists){
      const d = doc.data();
      if(d.clients){ const c=JSON.parse(d.clients); if(Object.keys(c).length) DB.clients=c; }
      if(d.obras)  { const o=JSON.parse(d.obras);   if(Object.keys(o).length) DB.obras=o; }
    }
    // Garantir que toda obra tenha um array de fotos, e carregar da subcoleção própria
    // (com migração automática: se a subcoleção ainda estiver vazia mas o formato antigo
    // tinha fotos embutidas no documento principal, usa essas como ponto de partida)
    const obrasComFotosAntigas = (doc.exists && doc.data().obras) ? JSON.parse(doc.data().obras) : {};
    const idsObras = Object.keys(DB.obras);
    await Promise.all(idsObras.map(async function(k){
      let fotos = await _carregarFotosObraSubcolecao(k);
      if((!fotos||!fotos.length) && obrasComFotosAntigas[k] && obrasComFotosAntigas[k].fotos && obrasComFotosAntigas[k].fotos.length){
        fotos = obrasComFotosAntigas[k].fotos;
        DB.obras[k].fotos = fotos;
        _syncFotosObraSubcolecao(k); // migra pra subcoleção nova em segundo plano
      } else {
        DB.obras[k].fotos = fotos;
      }
    }));
    // Carregar documentos de coleção separada
    try{
      const docSnap = await _db.collection('portal').doc('documentos').get();
      if(docSnap.exists && docSnap.data().lista){
        const docs = JSON.parse(docSnap.data().lista);
        if(Array.isArray(docs) && docs.length) DB.documentos = docs;
      }
    }catch(e2){ console.warn('Documentos: erro ao carregar', e2); }
    // Tentar carregar portal_videos como complemento (fallback se videos não vieram no principal)
    try {
      const vSnap = await _db.collection('portal_videos').get();
      vSnap.forEach(function(vDoc){
        const oid=vDoc.id;
        const vd=vDoc.data();
        if(vd.videos&&DB.obras[oid]){
          try{
            const lista=JSON.parse(vd.videos);
            // Usar portal_videos só se o documento principal não trouxe videos
            if(!DB.obras[oid].videos||!DB.obras[oid].videos.length){
              DB.obras[oid].videos=lista;
            }
          }catch(e){}
        }
      });
    } catch(e2){ console.warn('portal_videos indisponível (usando principal):',e2.code); }
  } catch(e){ console.warn('Erro ao carregar:',e); }
  const el=document.getElementById('_sync-ind');
  if(el) el.style.display='none';
}

function _patchFn(name){
  const orig = window[name];
  if(typeof orig==='function'){
    window[name] = function(){ const r=orig.apply(this,arguments); _syncDB(); return r; };
  }
}

// ── TABELAS OFICIAIS MCMV / SEGUROS CAIXA (vigentes desde abr/2026) ──
const MIP_TABLE = [
  {max:25, taxa:0.000053},
  {max:30, taxa:0.000062},
  {max:35, taxa:0.000082},
  {max:40, taxa:0.000102},

  {max:60, taxa:0.000414},
  {max:65, taxa:0.000599},
  {max:70, taxa:0.000868},
  {max:Infinity, taxa:0.001257},
];
const DFI_TABLE = [
  {max:100000, taxa:0.000085},
  {max:200000, taxa:0.000169},
  {max:300000, taxa:0.000220},
  {max:400000, taxa:0.000260},
  {max:Infinity, taxa:0.000300},
];
const FAIXA_MCMV = [
  {faixa:1, rendaMax:3200,  comFgts:[4.25,5.00],  semFgts:[5.00,5.00],  tetoImovel:275000},
  {faixa:2, rendaMax:5000,  comFgts:[5.50,6.50],  semFgts:[6.00,7.00],  tetoImovel:275000},
  {faixa:3, rendaMax:9600,  comFgts:[7.66,7.66],  semFgts:[8.16,8.16],  tetoImovel:400000},
  {faixa:4, rendaMax:13000, comFgts:[10.00,10.00],semFgts:[10.00,10.00],tetoImovel:600000},
];
const TAXA_ADMIN_MENSAL = 25;
function _mipTaxa(idade){
  for(var i=0;i<MIP_TABLE.length;i++) if(idade<=MIP_TABLE[i].max) return MIP_TABLE[i].taxa;
  return MIP_TABLE[MIP_TABLE.length-1].taxa;
}
function _dfiTaxa(valorImovel){
  for(var i=0;i<DFI_TABLE.length;i++) if(valorImovel<=DFI_TABLE[i].max) return DFI_TABLE[i].taxa;
  return DFI_TABLE[DFI_TABLE.length-1].taxa;
}
function _calcularIdade(dataNasc){
  if(!dataNasc) return 0;
  var nasc = new Date(dataNasc+'T12:00:00');
  if(isNaN(nasc.getTime())) return 0;
  var hoje = new Date();
  var idade = hoje.getFullYear() - nasc.getFullYear();
  var m = hoje.getMonth() - nasc.getMonth();
  if(m<0 || (m===0 && hoje.getDate()<nasc.getDate())) idade--;
  return idade;
}
function saCalcularAutomatico(){
  var pvOriginal=_saPn('sa-vf'), taxaAno=_saPp('sa-taxa'), nOriginal=_saPi('sa-prazo');
  var parcelasPagas=_saPi('sa-pagas')||0;
  // Se já existem parcelas pagas, usa o SALDO DEVEDOR ATUAL e o PRAZO RESTANTE —
  // não o valor financiado original. Isso importa muito quando alguém roda essa
  // calculadora anos depois de assinar o contrato: usar o valor original superestimaria
  // o MIP e o DFI, já que eles incidem sobre o saldo devedor de hoje, não o valor inicial.
  var usandoSaldoAtual = parcelasPagas>0;
  var pv = usandoSaldoAtual ? (_saPn('sa-saldo-atual')||pvOriginal) : pvOriginal;
  var n = usandoSaldoAtual ? Math.max(1, nOriginal-parcelasPagas) : nOriginal;
  var nasc1=(document.getElementById('sa-nasc1')||{value:''}).value;
  var nasc2=(document.getElementById('sa-nasc2')||{value:''}).value;
  var pct1=parseFloat((document.getElementById('sa-pct1')||{value:'100'}).value.replace(',','.'))||0;
  var pct2=parseFloat((document.getElementById('sa-pct2')||{value:'0'}).value.replace(',','.'))||0;
  var idade1=_calcularIdade(nasc1);
  var idade2=_calcularIdade(nasc2);
  var valorImovel=_saPn('sa-valor-imovel')||pvOriginal;
  if(!pv||!taxaAno||!n||!idade1){
    toast('Preencha valor financiado, taxa, prazo (nos campos acima) e a data de nascimento do Devedor 1 antes de calcular.', true);
    return;
  }
  // Se o % dos dois devedores não fecha 100, ajusta o devedor 1 pra fechar (assume só 1 devedor)
  if(pct2>0 && Math.round(pct1+pct2)!==100){
    toast('⚠️ % de composição de renda dos dois devedores não soma 100% — confira antes de usar o resultado.', true);
  }
  var i=taxaAno/100/12;
  var pot=Math.pow(1+i,n);
  var pmt=pv*(i*pot)/(pot-1);
  // MIP: cada devedor paga sobre o saldo devedor, proporcional à sua % de composição de renda
  var mip1 = pv*(pct1/100)*_mipTaxa(idade1);
  var mip2 = (idade2 && pct2>0) ? pv*(pct2/100)*_mipTaxa(idade2) : 0;
  var mip = mip1+mip2;
  var dfi=valorImovel*_dfiTaxa(valorImovel);
  var total=pmt+mip+dfi+TAXA_ADMIN_MENSAL;
  var el=document.getElementById('sa-prim-parc-input');
  if(el){ el.value=total.toFixed(2).replace('.',','); el.dispatchEvent(new Event('blur')); }
  var det=document.getElementById('sa-calc-detalhe');
  if(det){
    det.style.display='block';
    var linhaMip = mip2>0
      ? 'MIP — Devedor 1 (idade '+idade1+', '+pct1+'% da renda): <b>'+_saFmtD(mip1)+'</b> + Devedor 2 (idade '+idade2+', '+pct2+'% da renda): <b>'+_saFmtD(mip2)+'</b> = <b>'+_saFmtD(mip)+'</b>'
      : 'MIP (seguro morte/invalidez, idade '+idade1+'): <b>'+_saFmtD(mip)+'</b>';
    var linhaBase = usandoSaldoAtual
      ? '<div style="margin-bottom:6px;color:var(--tx3)">📌 Calculado sobre o <b>saldo devedor atual</b> ('+_saFmtD(pv)+', com '+n+' parcelas restantes) — não sobre o valor financiado original.</div>'
      : '';
    det.innerHTML=linhaBase+'PMT (Tabela PRICE): <b>'+_saFmtD(pmt)+'</b><br>'+linhaMip+'<br>DFI (seguro do imóvel): <b>'+_saFmtD(dfi)+'</b> &nbsp;+&nbsp; Taxa admin.: <b>'+_saFmtD(TAXA_ADMIN_MENSAL)+'</b> &nbsp;=&nbsp; <b style="color:#a78bfa">'+_saFmtD(total)+'</b>';
  }
  toast('✅ 1ª parcela calculada e preenchida!');
}
function _saPn(id){ var e=document.getElementById(id);if(!e)return 0;return parseFloat(e.value.replace(/[R$\s.]/g,'').replace(',','.'))||0; }
function _saPi(id){ var e=document.getElementById(id);if(!e)return 0;return parseInt(e.value.replace(/[^0-9]/g,''))||0; }
function _saPp(id){ var e=document.getElementById(id);if(!e)return 0; var v=e.value.replace(/[R$\s%]/g,''); if(v.includes(',')&&v.includes('.')) v=v.replace(/\./g,'').replace(',','.'); else if(v.includes(',')) v=v.replace(',','.'); return parseFloat(v)||0; }
function _saSet(id,v){ var e=document.getElementById(id);if(e)e.textContent=v; }
function _saM2s(m){ var a=Math.floor(m/12),mm=m%12;return(a>0?a+' ano'+(a>1?'s':'')+' ':'')+(mm>0?mm+' mês'+(mm>1?'es':''):''); }
function _saGetFreq(){ var v=document.querySelector('input[name="sa-freq"]:checked');if(!v)return 12;if(v.value==='mensal')return 1;if(v.value==='anual')return 12;if(v.value==='unica')return -1;return parseInt(document.getElementById('sa-freq-x').value)||6; }

function _saAddFmt(id,t){
  var e=document.getElementById(id);if(!e||e._fmt)return;e._fmt=true;
  function parseRaw(s){
    s=s.replace(/[R$\s]/g,'').replace('%','');
    if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
    else if(s.includes(','))s=s.replace(',','.');
    return parseFloat(s)||0;
  }
  e.addEventListener('focus',function(){ var v=parseRaw(this.value)||''; this.value=v; });
  e.addEventListener('blur',function(){
    var v=parseRaw(this.value);
    this.value=t==='R'?_saFmtD(v):(t==='%'?v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':v);
  });
}

  });}
  document.querySelectorAll('input[name="sa-freq"]').forEach(function(r){

function _saPreencherCampos(d){

    var el = document.getElementById(id);
    if(!el) return;
    el.value = v;
    el.dispatchEvent(new Event('blur')); // aplica formatação
  };
  setVal('sa-vf',    (d.vf||0).toLocaleString('pt-BR',{minimumFractionDigits:2}));
  // Setar taxa como número puro — o blur vai formatar corretamente
  if(d.taxa){ var el=document.getElementById('sa-taxa'); if(el){ el.value=d.taxa; el.dispatchEvent(new Event('blur')); } }
  if(d.prazo) setVal('sa-prazo', d.prazo);
  setVal('sa-sub',   (d.sub||0).toLocaleString('pt-BR',{minimumFractionDigits:2}));
  setVal('sa-pagas', d.pagas||0);
  setVal('sa-saldo-atual', (d.vf||0).toLocaleString('pt-BR',{minimumFractionDigits:2}));
  if(d.devedores && d.devedores.length){
    var d1=d.devedores[0], d2=d.devedores[1];
    if(d1){
      if(d1.nasc){ var e1=document.getElementById('sa-nasc1'); if(e1) e1.value=d1.nasc; }
      var p1=document.getElementById('sa-pct1'); if(p1) p1.value=d1.pct;
    }
    if(d2){
      if(d2.nasc){ var e2=document.getElementById('sa-nasc2'); if(e2) e2.value=d2.nasc; }
      var p2=document.getElementById('sa-pct2'); if(p2) p2.value=d2.pct;
    }
  }
  // Sistema de amortização
  var sis = document.getElementById('sa-sis');
  if(sis && d.sis){
    var v = d.sis.toUpperCase().includes('SAC')?'SAC':'PRICE';
    sis.value = v;
  }
  // Limpar campo de amortização (usuário preenche)
  var vamortEl = document.getElementById('sa-vamort');
  if(vamortEl){ vamortEl.value = ''; }
  // Preencher campo de 1ª parcela
  setTimeout(function(){
    var ppEl = document.getElementById('sa-prim-parc-input');
    var r1El = document.getElementById('sa-r1');
    if(d.primeiraParc && d.primeiraParc > 0){
      if(ppEl){ ppEl.value = _saFmtD(d.primeiraParc); ppEl.dispatchEvent(new Event('blur')); }
      if(r1El) r1El.textContent = _saFmtD(d.primeiraParc);
    }
  }, 200);
}

function _saCarregarDocumento(d, msg, onDone){
  if(!d){ if(onDone)onDone(false); return; }
  // Documentos enviados via Storage (têm "url", sem base64 embutido)
  if((!d.b64 || d.b64==='') && d.url){
    fetch(d.url).then(function(resp){
      if(!resp.ok) throw new Error('Falha ao baixar o arquivo (HTTP '+resp.status+')');
      return resp.arrayBuffer();
    }).then(function(buf){
      _saLerPdfEPreencher(new Uint8Array(buf), msg);
      if(onDone) onDone(true);
    }).catch(function(e){
      console.error(e);
      if(msg){ msg.style.display='block'; msg.style.background='rgba(239,68,68,.1)'; msg.style.borderColor='rgba(239,68,68,.3)'; msg.style.color='var(--red)'; msg.innerHTML='❌ Erro ao baixar esse documento do Storage.'; }
      if(onDone) onDone(false);
    });
    return;
  }
  // Documentos enviados com base64 embutido
  if(!d.b64){ if(onDone)onDone(false); return; }
  try{
    var base64 = d.b64.split(',')[1] || d.b64; // remove prefixo "data:application/pdf;base64,"
    var binStr = atob(base64);
    var bytes = new Uint8Array(binStr.length);
    for(var i=0;i<binStr.length;i++) bytes[i] = binStr.charCodeAt(i);
    _saLerPdfEPreencher(bytes, msg);
    if(onDone) onDone(true);
  }catch(e){
    console.error(e);
    if(msg){ msg.style.display='block'; msg.style.background='rgba(239,68,68,.1)'; msg.style.borderColor='rgba(239,68,68,.3)'; msg.style.color='var(--red)'; msg.innerHTML='❌ Erro ao ler esse documento.'; }
    if(onDone) onDone(false);
  }
}

function _saLerPdfEPreencher(typedArray, msg){
  function carregar(){
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsLib.getDocument({data: typedArray}).promise.then(function(pdf){
      var pages = [];
      for(var i=1;i<=pdf.numPages;i++) pages.push(i);
      return Promise.all(pages.map(function(n){
        return pdf.getPage(n).then(function(pg){
          return pg.getTextContent().then(function(tc){
            return tc.items.map(function(it){return it.str;}).join(' ');
          });
        });
      }));
    }).then(function(textos){
      var txt = textos.join(' ');
      window._ultimoTextoPdfExtraido = txt; // guarda pra diagnóstico (console: copy(window._ultimoTextoPdfExtraido))
      var d = _saParsearSimulacao(txt);
      window._ultimoResultadoParse = d; // idem, pra ver o que foi interpretado
      if(!d.vf && !d.taxa){
        if(msg){ msg.style.background='rgba(245,158,11,.1)'; msg.style.borderColor='rgba(245,158,11,.3)'; msg.style.color='var(--acc)'; msg.innerHTML='⚠️ Não reconheci os dados. Preencha manualmente.'; setTimeout(function(){msg.style.display='none';},5000); }
        return;
      }
      _saPreencherCampos(d);
      if(msg){ msg.style.background='rgba(34,197,94,.1)'; msg.style.borderColor='rgba(34,197,94,.3)'; msg.style.color='var(--green)'; msg.innerHTML='✅ Dados preenchidos automaticamente!'; setTimeout(function(){msg.style.display='none';},4000); }
    }).catch(function(err){
      if(msg){ msg.style.background='rgba(239,68,68,.1)'; msg.style.borderColor='rgba(239,68,68,.3)'; msg.style.color='var(--red)'; msg.innerHTML='❌ Erro ao ler PDF. Preencha manualmente.'; setTimeout(function(){msg.style.display='none';},5000); }
      console.error(err);
    });
  }
  if(window.pdfjsLib){ carregar(); return; }
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload = carregar;
  document.head.appendChild(s);
}

function _saExtrairTaxaContratada(txt){
  // A tabela B.9 do contrato Caixa repete, para cada uma das 4 colunas
  // (Sem Desconto / Com Desconto / Com Redutor / Taxa Contratada), o padrão:
  // "Nominal % (a.a.)" seguido do valor daquela coluna. A 4ª ocorrência é a Taxa Contratada.
  var re = /Nominal\s*%?\s*\(\s*a\.?\s*a\.?\s*\)\s*(N[aã]o se aplica|[\d]{1,2}[.,][\d]{2,4})/gi;
  var matches = [];
  var m;
  while((m = re.exec(txt))){ matches.push(m[1]); }
  if(matches.length){
    var ultimo = matches[matches.length-1];
    var n = parseFloat(String(ultimo).replace(',','.'));
    if(!isNaN(n) && n>0 && n<30) return n;
  }
  return null;
}
function _saExtrairPrazo(txt){
  // B8 costuma ser uma tabela de 3 colunas (Prazo Total / Amortização / Construção).
  // Dependendo de como o PDF extrai o texto, os 3 números podem vir todos juntos,
  // separados dos rótulos — por isso pegamos o 1º número plausível depois do rótulo.
  var partes = txt.split(/Prazo\s+Total\s*\(?\s*meses\s*\)?\s*:?/i);
  if(partes.length>=2){
    var bloco = partes[1].split(/B\.?\s*9|Taxa de Juros/i)[0] || partes[1];
    var nums = bloco.match(/\d{1,3}/g) || [];
    for(var i=0;i<nums.length;i++){
      var n = parseInt(nums[i],10);
      if(n>=12 && n<=480) return n;
    }
  }
  var m = txt.match(/Prazo\s+escolhido[:\s]*([\d]+)/i);
  if(m) return parseInt(m[1],10);
  m = txt.match(/Prazo\s+m[aá]ximo[:\s]*([\d]+)/i);
  if(m) return parseInt(m[1],10);
  // Último fallback: procurar "NNN meses" plausível pra um financiamento (60 a 480 meses),
  // evitando pegar números de outras cláusulas do contrato (ex: "36 meses de trabalho no FGTS")
  var matches = txt.match(/\d{2,3}\s*meses/gi) || [];
  for(var i=0;i<matches.length;i++){
    var n2 = parseInt(matches[i],10);
    if(n2>=60 && n2<=480) return n2;
  }
  return null;
}
function _saExtrairDevedores(txt){
  var resultado = [];
  var limite = txt.search(/DESCRI[CÇ][AÃ]O DO IM[OÓ]VEL/i);
  var busca = limite>0 ? txt.slice(0, limite) : txt;
  var re = /([A-ZÀ-Ü][A-ZÀ-Ü\s]{5,50}?)\s+([\d]{1,3}(?:\.[\d]{3})*,[\d]{2})\s+([\d]{1,3}[.,][\d]{1,2})\b/g;
  var m;
  while((m=re.exec(busca))){
    var nome = m[1].trim();
    var pct = parseFloat(m[3].replace(',','.'));
    if(nome.length>5 && pct>0 && pct<=100 && !/DEVEDOR|RENDA|NOME/i.test(nome)){
      resultado.push({nome:nome, pct:pct});
    }
  }
  // Buscar data de nascimento de cada devedor pelo nome (seção A2 do contrato)
  resultado.forEach(function(d){
    var primeiras2Palavras = d.nome.split(/\s+/).slice(0,2).join('\\s+');
    try{
      var re2 = new RegExp(primeiras2Palavras+'[\\s\\S]{0,150}?nascido\\(a\\)\\s+em\\s+(\\d{2}/\\d{2}/\\d{4})','i');
      var mm = txt.match(re2);
      if(mm){
        var p = mm[1].split('/');
        d.nasc = p[2]+'-'+p[1]+'-'+p[0]; // formato yyyy-mm-dd (input type=date)
      }
    }catch(e){}
  });
  return resultado;
}
function _saExtrairTaxaFallbackFrequencia(txt){
  // Último recurso: acha o número (formato de taxa) que mais se repete no documento,
  // dentro de uma faixa plausível de juros de financiamento (3% a 15% a.a.)
  var nums = txt.match(/\b\d{1,2}[.,]\d{2,4}\b/g) || [];
  var freq = {};
  nums.forEach(function(s){
    var n = parseFloat(String(s).replace(',','.'));
    if(n>=3 && n<=15){
      var chave = n.toFixed(2);
      freq[chave] = (freq[chave]||0)+1;
    }
  });
  var melhor=null, melhorCount=0;
  Object.keys(freq).forEach(function(k){
    if(freq[k]>melhorCount){ melhorCount=freq[k]; melhor=parseFloat(k); }
  });
  return melhorCount>=2 ? melhor : null;
}
function _saParsearSimulacao(txt){
  function val(pats){
    for(var i=0;i<pats.length;i++){
      var m=txt.match(pats[i]);
      if(m&&m[1]){ var n=parseFloat(m[1].replace(/\./g,'').replace(',','.')); if(!isNaN(n)) return n; }
    }
    return null;
  }
  // Taxa especial: pode ser "4,75" ou "4.75" — não remover pontos decimais
  function valTaxa(pats){
    for(var i=0;i<pats.length;i++){
      var m=txt.match(pats[i]);
      if(m&&m[1]){
        // Converter vírgula decimal para ponto, mas preservar ponto decimal
        var s=m[1].trim();
        // Se tem vírgula, é separador decimal pt-BR: "4,75" → 4.75
        if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
        // Se não tem vírgula mas tem ponto, é decimal: "4.75" → já ok
        var n=parseFloat(s);
        if(!isNaN(n) && n>0 && n<30) return n; // taxa razoável entre 0 e 30%
      }
    }
    return null;
  }
  return {
    vf:    val([/Valor do financiamento\s*R\$\s*([\d.,]+)/i,
                /Valor da D[ií]vida\s*\(Financiamento\)[:\s]*R\$\s*([\d.,]+)/i,
                /financiamento[^R]*R\$\s*([\d.,]+)/i]),
    taxa:  _saExtrairTaxaContratada(txt) || valTaxa([/Juros Nominais\s*([\d.,]+)%/i, /Juros Efetivos\s*([\d.,]+)%/i, /([\d.,]+)%\s*a\.a/i]) || _saExtrairTaxaFallbackFrequencia(txt),
    prazo: _saExtrairPrazo(txt) || val([/Prazo escolhido\s*(\d+)/i, /Prazo m[aá]ximo\s*(\d+)/i]),
    sub:   val([/Subs[ií]dio[^R]*R\$\s*([\d.,]+)/i]),
    sis:   /PRICE/i.test(txt)?'PRICE':'SAC',
    pagas: 0,
    primeiraParc: val([/Encargo Mensal Inicial[\s\S]{0,400}?Total:?\s*R\$\s*([\d.,]+)/i,
                       /1[aª°]\s*Presta[cç][aã]o[^R]*R\$\s*([\d.,]+)/i,
                       /Primeira[^R]*R\$\s*([\d.,]+)/i,
                       /Presta[cç][aã]o[^\d]*R\$\s*([\d.,]+)/i]),
    devedores: _saExtrairDevedores(txt)
  };
}

  var pg=document.getElementById('sa-pagas');
  if(pg&&!pg._ev){pg._ev=true;pg.addEventListener('blur',function(){
    var vf=_saPn('sa-vf'),taxa=_saPp('sa-taxa')/100/12,n=_saPi('sa-prazo'),sis=(document.getElementById('sa-sis')||{value:'PRICE'}).value;

function _saCalc(){
  try{
    var vf=_saPn('sa-vf')||0,taxa=_saPp('sa-taxa')/100/12||0,n=_saPi('sa-prazo')||0;
    if(!vf||!taxa||!n){console.warn('Dados incompletos: vf='+vf+' taxa='+taxa+' n='+n);if(typeof toast==='function')toast('Preencha os dados do financiamento antes de calcular.',true);return;}
    var sis=(document.getElementById('sa-sis')||{value:'PRICE'}).value,sA=_saPn('sa-saldo-atual')||vf;
    var pR=Math.max(1,n-(_saPi('sa-pagas')||0)),va=_saPn('sa-vamort')||0;

    var tipoEl=document.querySelector('input[name="sa-tipo"]:checked'),tipo=tipoEl?tipoEl.value:'prazo';
    var sub=_saPn('sa-sub')||0;

    var _primParcVal = _saPn('sa-prim-parc-input');
    var p0 = _primParcVal > 0 ? _primParcVal
           : (sis==='PRICE' ? sA*(taxa*Math.pow(1+taxa,pR))/(Math.pow(1+taxa,pR)-1) : sA/pR+sA*taxa);
    var s=sA,jS=0,rS=[];
    for(var i=1;i<=pR+10;i++){var j=s*taxa;jS+=j;var ao=sis==='PRICE'?p0-j:sA/pR;s-=ao;if(s<0)s=0;rS.push({s:s});if(s<=0.01)break;}
    var jC=0,nP=pR,sC=sA,pC=p0,amortFixaAtual=sA/pR,ext=0,rC=[],rows=[];
    for(var i=1;i<=pR+300;i++){
      var j=sC*taxa,ao=sis==='PRICE'?pC-j:amortFixaAtual,ex=0;
      var ap=(freq===-1)?(i===ini):(i>=ini&&(i-ini)%freq===0);
      if(va>0&&ap)ex=Math.min(va,Math.max(0,sC-ao));
      jC+=j;ext+=ex;sC-=(ao+ex);
      if(tipo==='parcela'&&ex>0&&sC>0.01){
        var rN=pR-i;
        if(rN>0){
          if(sis==='PRICE'){
            pC=sC*(taxa*Math.pow(1+taxa,rN))/(Math.pow(1+taxa,rN)-1);
          } else {
            // SAC: recalcula a NOVA amortização fixa (não usa fórmula do PRICE)
            amortFixaAtual=sC/rN;
          }
        }
      }
      var prestacaoLinha=sis==='PRICE'?(pC||p0):(ao+j);
      var sv=Math.max(0,sC);rC.push({s:sv});rows.push({i:i,p:prestacaoLinha,j:j,ao:ao,ex:ex,s:sv});

    _saSet('sa-rec',_saFmt(eco));_saSet('sa-rj-sem',_saFmt(jS));_saSet('sa-rj-com',_saFmt(jC));
    _saSet('sa-r1',_saFmtD(p0));
    // Sincronizar campo 1ª Prestação com p0 se vazio
    var _ppEl=document.getElementById('sa-prim-parc-input');

    _saSet('sa-rp',tipo==='prazo'?(nP<pR?nP+' meses (−'+diff+')':pR+' meses'):(pR+' meses'));
    _saSet('sa-ramort',_saFmt(ext));
    _saSet('sa-c-sem',pR+' meses ('+_saM2s(pR).trim()+')');
    _saSet('sa-c-com',nP+' meses ('+_saM2s(nP).trim()+')');
    _saSet('sa-c-tempo',diff>0?diff+' meses a menos ('+_saM2s(diff).trim()+')':'Prazo mantido');
    _saSet('sa-c-din',_saFmt(eco)+' economizados em juros');
    var fqn={mensal:'todo mês',anual:'uma vez ao ano',unica:'apenas uma vez',custom:'a cada '+_saGetFreq()+' meses'};
    var fqEl=document.querySelector('input[name="sa-freq"]:checked'),fq=fqEl?fqEl.value:'anual';
    var narr=document.getElementById('sa-narrativa');
    if(narr)narr.innerHTML='Com amortizações de <b>'+_saFmtD(va)+'</b> ('+fqn[fq]+') a partir da parcela <b>'+ini+'</b>, a economia estimada é de <b>'+_saFmt(eco)+'</b> em juros.'+(diff>0?' O financiamento terminaria <b>'+diff+' meses antes</b>.':' Sua parcela ficará menor após cada amortização.');
    var ce=document.getElementById('sa-chart-saldo');
    if(ce&&typeof Chart!=='undefined'){
      if(_saChart){_saChart.destroy();_saChart=null;}
      var step=Math.max(1,Math.floor(Math.max(rS.length,rC.length)/60)),lb=[],dS=[],dC=[];
      for(var i=0;i<Math.max(rS.length,rC.length);i+=step){lb.push('P'+(i+1));dS.push(Math.round((rS[Math.min(i,rS.length-1)]||{s:0}).s));dC.push(Math.round((rC[Math.min(i,rC.length-1)]||{s:0}).s));}
      _saChart=new Chart(ce,{type:'line',data:{labels:lb,datasets:[{label:'Sem amortização',data:dS,borderColor:'#E24B4A',backgroundColor:'rgba(226,75,74,.08)',borderWidth:2,pointRadius:0,fill:true,tension:0.3},{label:'Com amortização',data:dC,borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.08)',borderWidth:2,pointRadius:0,fill:true,tension:0.3,borderDash:[5,3]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:function(v){return 'R$'+Math.round(v/1000)+'k';}},grid:{color:'rgba(128,128,128,.08)'}},x:{ticks:{maxTicksLimit:10},grid:{display:false}}}}});
    }
    var mostrar=[1,2,3,6,12,24,36,48,60,120,180,240,300,360,420],html='';
    rows.forEach(function(r){
      if(mostrar.indexOf(r.i)<0&&r.ex===0)return;if(r.i>360&&r.ex===0)return;
      var bg=r.ex>0?' style="background:rgba(22,163,74,.06)"':'';
      html+='<tr'+bg+'><td style="padding:6px 10px;text-align:center;border-bottom:1px solid var(--bd);font-weight:500;color:var(--tx3)">'+r.i+'</td><td style="padding:6px 10px;text-align:right;border-bottom:1px solid var(--bd)">'+_saFmtD(r.p)+'</td><td style="padding:6px 10px;text-align:right;border-bottom:1px solid var(--bd);color:#ef4444">'+_saFmtD(r.j)+'</td><td style="padding:6px 10px;text-align:right;border-bottom:1px solid var(--bd);color:#16a34a">'+_saFmtD(r.ao)+'</td><td style="padding:6px 10px;text-align:right;border-bottom:1px solid var(--bd);color:'+(r.ex>0?'#16a34a;font-weight:700">'+_saFmtD(r.ex):'var(--tx3)">—')+'</td><td style="padding:6px 10px;text-align:right;border-bottom:1px solid var(--bd)">'+_saFmt(r.s)+'</td></tr>';
    });
    var tb=document.getElementById('sa-tbody');if(tb)tb.innerHTML=html;
    var res=document.getElementById('sa-resultados');if(res){res.style.display='block';res.scrollIntoView({behavior:'smooth',block:'start'});}
  }catch(e){console.error('_saCalc:',e);alert('Erro no cálculo: '+e.message);}
}

// ════════════════════════════════════════════════════════
// ATUALIZAÇÃO EM TEMPO REAL DO FIRESTORE
// Sempre que o CasaFácil exportar dados, o portal atualiza automaticamente
// ════════════════════════════════════════════════════════
var _obraListener = null;

// Carrega fotos e vídeos do portal/dados e mescla com os dados da obra
function _carregarDocumentosDoPortal(){
  if(!_fbReady||!_db) return;
  // Carregar documentos E clients em paralelo
  Promise.all([
    _db.collection('portal').doc('documentos').get(),
    _db.collection('portal').doc('dados').get()
  ]).then(function(results){
    const snapDocs = results[0];
    const snapDados = results[1];
    // Carregar clients se ainda não carregado (para o filtro de login funcionar)
    if(snapDados.exists && snapDados.data().clients){
      try{
        const c = JSON.parse(snapDados.data().clients);
        if(Object.keys(c).length) DB.clients = c;
      }catch(e){}
    }
    // Carregar documentos
    if(snapDocs.exists && snapDocs.data().lista){
      try{
        const docs = JSON.parse(snapDocs.data().lista);
        if(Array.isArray(docs)){
          DB.documentos = docs;
          if(snapDocs.data().solicitacoes){try{DB.solicitacoesExclusao=JSON.parse(snapDocs.data().solicitacoes);}catch(e2){}}
          setTimeout(function(){ try{ renderDocumentosCliente(); }catch(e){ console.error('[docs] render erro:', e); } }, 100);
        }
      }catch(e){ console.warn('Docs cliente: erro ao parsear', e); }
    }
  }).catch(function(e){ console.warn('Docs cliente: indisponível', e); });
}

function _paginaProtegidaDeRedesenho(){
  // Enquanto o usuário estiver na aba "Dicas e Escolhas" (simulador com campos digitáveis),
  // não redesenhar a tela sozinho — isso apagaria o que ele estiver digitando.
  var pg = document.querySelector('#main .page.on');
  return !!(pg && pg.id === 'pg-c-dicas');
}
function _carregarFotosDoPortal(chave){
  if(!_fbReady||!_db) return;
  // O obraId no DB.clients é a chave real em DB.obras (ex: 'ob1714000000000')
  // O 'chave' aqui é o login do cliente (ex: 'julian')
  // Precisamos do obraId via DB.clients[login].obraId
  var obraIdReal = null;
  // Primeiro buscar o cliente pelo login para obter obraId
  _db.collection('portal').doc('dados').get().then(async function(doc){
    if(!doc.exists) return;
    const d = doc.data();
    try{
      // Buscar obraId real via clientes
      if(d.clients){
        const clients = JSON.parse(d.clients);
        const clienteEntry = clients[chave];
        if(clienteEntry && clienteEntry.obraId){
          obraIdReal = clienteEntry.obraId;
        }
      }
      if(!d.obras) return;
      const obrasPortal = JSON.parse(d.obras);
      var chaveResolvida = (obraIdReal && obrasPortal[obraIdReal]) ? obraIdReal : null;
      if(!chaveResolvida){
        // Fallback: procurar pelo nome da obra ou login
        const nomeObra = (obra.nomeObra||obra.nome||'').toLowerCase();
        const entradaFallback = Object.entries(obrasPortal).find(function(entry){
          const o = entry[1];
          return (o.nome||'').toLowerCase()===nomeObra
              || (o.nomeObra||'').toLowerCase()===nomeObra;
        });
        if(entradaFallback) chaveResolvida = entradaFallback[0];
      }
      if(!chaveResolvida){
        console.warn('[portal] Obra não encontrada em portal/dados para login:', chave, 'obraId:', obraIdReal);
        return;
      }
      var houveMudanca = false;
      // Buscar fotos na subcoleção própria dessa obra (com fallback pro formato antigo, se ainda não migrado)
      let fotos = await _carregarFotosObraSubcolecao(chaveResolvida);
      const obraPortal = obrasPortal[chaveResolvida];
      if((!fotos||!fotos.length) && obraPortal && obraPortal.fotos && obraPortal.fotos.length){
        fotos = obraPortal.fotos;
        if(DB.obras[chaveResolvida]){ DB.obras[chaveResolvida].fotos = fotos; _syncFotosObraSubcolecao(chaveResolvida); }
      }
      if(fotos && fotos.length){
        obra.fotos = fotos;
        if(DB.obras[chave]) DB.obras[chave].fotos = fotos;
        houveMudanca = true;
      }
      // Mesclar vídeos (continuam vindo do documento principal)
      if(obraPortal && obraPortal.videos && obraPortal.videos.length){
        obra.videos = obraPortal.videos;
        if(DB.obras[chave]) DB.obras[chave].videos = obraPortal.videos;
        houveMudanca = true;
      }
      if(houveMudanca && !_paginaProtegidaDeRedesenho()){
        try{ buildClientPages(); }catch(e){}
        try{ buildVideoPersonalizado(); }catch(e){}
      }
    }catch(e){ console.warn('Erro ao carregar fotos do portal:', e); }
  }).catch(function(e){ console.warn('Fotos: portal/dados indisponível', e); });
}

function _iniciarListenerTempoReal(key){
  // Cancelar listener anterior se existir
  if(_obraListener){ try{_obraListener();}catch(e){} _obraListener=null; }
  if(!_fbReady||!_db||!key) return;
  var _primeiraExec = true;
  _obraListener = _db.collection('obraviva').doc(key).onSnapshot(function(doc){
    if(!doc.exists) return;
    // Primeira execução é só o carregamento inicial — não re-renderizar
    if(_primeiraExec){ _primeiraExec=false; return; }
    const dadosNovos = doc.data();
    // Preservar fotos e vídeos carregados do portal/dados (não vêm do obraviva)
    if(obra && obra.fotos && obra.fotos.length && (!dadosNovos.fotos || !dadosNovos.fotos.length)){
      dadosNovos.fotos = obra.fotos;
    }
    if(obra && obra.videos && obra.videos.length && (!dadosNovos.videos || !dadosNovos.videos.length)){
      dadosNovos.videos = obra.videos;
    }
    obra = dadosNovos;
    DB.obras[key] = obra;
    
    // Reconstruir páginas (exceto se o usuário estiver digitando no simulador)
    if(!_paginaProtegidaDeRedesenho()){
      try{ buildClientPages(); }catch(e){ console.warn('buildClientPages:', e); }
      try{ buildVideoPersonalizado(); }catch(e){}
    }
    
    // Atualizar sidebar
    var sbRole = document.getElementById('sb-role');
    if(sbRole) sbRole.textContent = (obra.nomeObra||obra.nome||'').split('–')[0].trim();
    
    // Notificação
    toast('✅ Obra atualizada pelo responsável');
  }, function(err){
    console.warn('[portal] Listener erro:', err);
  });
}

// ── Polling de backup para atualizações ──
// Verifica a cada 60s se o Firestore tem dados mais novos
var _pollingTimer = null;
function _iniciarPolling(key){
  if(_pollingTimer) clearInterval(_pollingTimer);
  if(!key || !_fbReady || !_db) return;
  _pollingTimer = setInterval(function(){
    // Verificar fotos/vídeos novos (portal/dados) a cada verificação, não só no login
    _carregarFotosDoPortal(key);
    _db.collection('obraviva').doc(key).get().then(function(doc){
      if(!doc.exists) return;
      var d = doc.data();
      var tsNovo = d._exportDate || '';
      var tsAtual = obra && (obra._exportDate || '');
      if(tsNovo && tsAtual && tsNovo !== tsAtual){
        // Preservar fotos e vídeos carregados do portal/dados (não vêm do obraviva)
        if(obra && obra.fotos && obra.fotos.length && (!d.fotos || !d.fotos.length)){
          d.fotos = obra.fotos;
        }
        if(obra && obra.videos && obra.videos.length && (!d.videos || !d.videos.length)){
          d.videos = obra.videos;
        }
        obra = d;
        DB.obras[key] = d;
        if(!_paginaProtegidaDeRedesenho()){
          try{ buildClientPages(); }catch(e){}
          try{ buildVideoPersonalizado(); }catch(e){}
          var sbRole=document.getElementById('sb-role');
          if(sbRole) sbRole.textContent=(obra.nomeObra||obra.nome||'').split('–')[0].trim();
          toast('✅ Obra atualizada pelo responsável');
        }
      }
    }).catch(function(){});
  }, 60000); // 60 segundos
}

  window.go=function(id,el){
    if(typeof orig==='function')orig(id,el);
    if(id==='c-dicas')setTimeout(_saInit,300);
