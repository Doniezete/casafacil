<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Casa Fácil — Cadastro do Evento</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0f1420;--card:#161d2e;--bd:#2a3454;--ac:#f59e0b;--ac2:#f97316;
  --tx:#eef1f8;--tx2:#e2e8f2;--mut:#8b94ad;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:16px;min-height:100vh}
.wrap{max-width:480px;margin:0 auto}
.logo{font-size:24px;font-weight:800;color:var(--ac);margin-bottom:2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.sec-title{color:var(--ac);font-weight:700;font-size:13px;margin:4px 0 12px;padding-top:10px;border-top:1px solid var(--bd)}
.sec-title:first-child{padding-top:0;border-top:none}
label{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px;font-weight:600}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#0c111c;color:var(--tx);font-size:16px;margin-bottom:14px}
input:focus,select:focus{outline:none;border-color:var(--ac)}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;font-size:14px;color:var(--tx2)}
.toggle input{width:auto;margin:0}
.total-box{background:rgba(245,158,11,.1);border:1px dashed var(--ac);border-radius:10px;padding:12px;margin-bottom:14px;text-align:center}
.total-box .valor{font-size:22px;font-weight:800;color:var(--ac)}
.btn{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a1206;font-weight:700;font-size:16px;cursor:pointer}
.btn:active{opacity:.85}
.status{text-align:center;padding:14px;border-radius:10px;margin-bottom:14px;font-size:14px;display:none}
.status.ok{background:rgba(34,197,94,.15);color:#4ade80;display:block}
.status.erro{background:rgba(239,68,68,.15);color:#f87171;display:block}
.contador{text-align:center;color:var(--mut);font-size:12px;margin-top:10px}
.terreno-box{display:none;background:#0c111c;border:1px dashed var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">CASA FÁCIL</div>
  <div class="sub">Cadastro rápido — Evento Jardim Ranzani</div>

  <div id="status" class="status"></div>

  <div class="card">
    <div class="sec-title">👤 Dados Pessoais</div>
    <label>Nome completo *</label>
    <input type="text" id="f_nome" placeholder="Nome da pessoa"/>

    <div class="linha2">
      <div>
        <label>Telefone (WhatsApp) *</label>
        <input type="tel" id="f_telefone" placeholder="(19) 99999-9999" oninput="fmtTelefone(this)"/>
      </div>
      <div>
        <label>CPF</label>
        <input type="text" id="f_cpf" placeholder="000.000.000-00" oninput="fmtCPF(this)"/>
      </div>
    </div>

    <div class="linha2">
      <div>
        <label>Data de nascimento</label>
        <input type="date" id="f_nascimento"/>
      </div>
      <div>
        <label>Profissão</label>
        <input type="text" id="f_profissao" placeholder="Ex: Professora"/>
      </div>
    </div>

    <label>Estado civil</label>
    <select id="f_civil">
      <option value="">Selecione...</option>
      <option value="solteiro">Solteiro(a)</option>
      <option value="casado">Casado(a)</option>
      <option value="uniao">União Estável</option>
      <option value="divorciado">Divorciado(a)</option>
      <option value="viuvo">Viúvo(a)</option>
    </select>

    <div class="sec-title">📍 Endereço</div>
    <label>Rua e número</label>
    <input type="text" id="f_rua" placeholder="Ex: Rua das Flores, 123"/>

    <div class="linha2">
      <div>
        <label>Bairro</label>
        <input type="text" id="f_bairro" placeholder="Ex: Centro"/>
      </div>
      <div>
        <label>CEP</label>
        <input type="text" id="f_cep" placeholder="00000-000" oninput="fmtCEP(this)"/>
      </div>
    </div>

    <div class="linha2">
      <div>
        <label>Cidade</label>
        <input type="text" id="f_cidade" placeholder="Ex: Vargem Grande do Sul"/>
      </div>
      <div>
        <label>UF</label>
        <select id="f_uf">
          <option value="SP">SP</option><option value="MG">MG</option><option value="RJ">RJ</option>
          <option value="PR">PR</option><option value="SC">SC</option><option value="RS">RS</option>
          <option value="MS">MS</option><option value="MT">MT</option><option value="GO">GO</option>
          <option value="BA">BA</option><option value="outro">Outro</option>
        </select>
      </div>
    </div>

    <div class="sec-title">📋 Informações pro Financiamento</div>

    <label>Já possui imóvel registrado no nome dela?</label>
    <select id="f_imovel">
      <option value="nao">Não</option>
      <option value="sim">Sim</option>
    </select>

    <label>Possui dependente na proposta? (cônjuge ou filho menor de 18)</label>
    <select id="f_dependente" onchange="alternarDependenteRenda()">
      <option value="nao">Não</option>
      <option value="sim">Sim</option>
    </select>
    <div id="boxDependenteRenda" style="display:none">
      <label>O dependente tem renda registrada em carteira?</label>
      <select id="f_dependenteRenda">
        <option value="nao">Não</option>
        <option value="sim">Sim</option>
      </select>
    </div>

    <label>Tem 3 anos de trabalho com carteira assinada (FGTS)?</label>
    <select id="f_fgts">
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <label class="toggle">
      <input type="checkbox" id="f_temConjuge" onchange="alternarConjuge()"/>
      Tem renda do cônjuge/companheiro(a) pra somar?
    </label>

    <label>Renda do titular (R$) *</label>
    <input type="text" inputmode="decimal" id="f_renda1" placeholder="0,00" oninput="fmtRenda(this);atualizarTotal()"/>

    <div id="boxConjuge" style="display:none">
      <label>Renda do cônjuge (R$)</label>
      <input type="text" inputmode="decimal" id="f_renda2" placeholder="0,00" oninput="fmtRenda(this);atualizarTotal()"/>
    </div>

    <div class="total-box">
      <div style="font-size:12px;color:var(--mut);margin-bottom:4px">Renda familiar total</div>
      <div class="valor" id="totalRenda">R$ 0,00</div>
    </div>

    <div class="sec-title">🏠 Terreno</div>
    <label>Já possui terreno?</label>
    <select id="f_temTerreno" onchange="alternarTerreno()">
      <option value="nao">Não — precisa adquirir</option>
      <option value="sim">Sim — já possui (ex: aqui no Jardim Ranzani)</option>
    </select>

    <div class="terreno-box" id="boxTerreno">
      <div class="linha2">
        <div>
          <label>Lote</label>
          <input type="text" id="f_tLote" placeholder="Ex: 14"/>
        </div>
        <div>
          <label>Quadra</label>
          <input type="text" id="f_tQuadra" placeholder="Ex: 7"/>
        </div>
      </div>
      <label>Área do terreno (m²)</label>
      <input type="number" id="f_tArea" placeholder="Ex: 200"/>
      <label>Endereço do terreno (rua e número)</label>
      <input type="text" id="f_tRua" placeholder="Ex: Rua das Palmeiras, 45"/>
      <div class="linha2">
        <div>
          <label>Bairro do terreno</label>
          <input type="text" id="f_tBairro" placeholder="Ex: Jardim Ranzani"/>
        </div>
        <div>
          <label>CEP do terreno</label>
          <input type="text" id="f_tCep" placeholder="00000-000" oninput="fmtCEP(this)"/>
        </div>
      </div>
      <label>Cidade do terreno</label>
      <input type="text" id="f_tCidade" placeholder="Ex: Vargem Grande do Sul"/>
    </div>

    <div class="sec-title">✍️ Atendimento</div>
    <label>Nome de quem está atendendo (opcional)</label>
    <input type="text" id="f_atendente" placeholder="Seu nome"/>

    <button class="btn" onclick="salvarCadastro()">✅ Salvar e cadastrar próxima pessoa</button>
  </div>

  <div class="contador" id="contador"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBZGILaMIHssrQaQz_ZTLH0ilWV1_kkMi0",
  authDomain: "casa-facil-4aef8.firebaseapp.com",
  projectId: "casa-facil-4aef8",
  storageBucket: "casa-facil-4aef8.firebasestorage.app",
  messagingSenderId: "244246614237",
  appId: "1:244246614237:web:45cc6e0db81559aed7cb34"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let totalSalvos = 0;

function fmtTelefone(el){
  var v = el.value.replace(/\D/g,'').substring(0,11);
  if(v.length<=2) el.value = v;
  else if(v.length<=7) el.value = '('+v.slice(0,2)+') '+v.slice(2);
  else el.value = '('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);
}
function fmtCPF(el){
  var v = el.value.replace(/\D/g,'').substring(0,11);
  if(v.length<=3) el.value = v;
  else if(v.length<=6) el.value = v.slice(0,3)+'.'+v.slice(3);
  else if(v.length<=9) el.value = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
  else el.value = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
}
function fmtCEP(el){
  var v = el.value.replace(/\D/g,'').substring(0,8);
  el.value = v.length<=5 ? v : v.slice(0,5)+'-'+v.slice(5);
}
function fmtRenda(el){
  var v = el.value.replace(/\D/g,'');
  if(!v){ el.value=''; return; }
  el.value = (parseInt(v,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function valorRenda(id){
  var v = document.getElementById(id).value;
  if(!v) return 0;
  return parseFloat(v.replace(/\./g,'').replace(',','.'))||0;
}
function alternarConjuge(){
  var marcado = document.getElementById('f_temConjuge').checked;
  document.getElementById('boxConjuge').style.display = marcado ? 'block' : 'none';
  if(!marcado){ document.getElementById('f_renda2').value=''; }
  atualizarTotal();
}
function alternarDependenteRenda(){
  document.getElementById('boxDependenteRenda').style.display = document.getElementById('f_dependente').value==='sim' ? 'block' : 'none';
}
function alternarTerreno(){
  document.getElementById('boxTerreno').style.display = document.getElementById('f_temTerreno').value==='sim' ? 'block' : 'none';
}
function atualizarTotal(){
  var r1 = valorRenda('f_renda1');
  var r2 = document.getElementById('f_temConjuge').checked ? valorRenda('f_renda2') : 0;
  var total = r1+r2;
  document.getElementById('totalRenda').textContent = 'R$ '+total.toLocaleString('pt-BR',{minimumFractionDigits:2});
}

function mostrarStatus(msg, tipo){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status '+tipo;
  setTimeout(function(){ el.className='status'; }, 4000);
}

function limparCampo(id){ document.getElementById(id).value=''; }

function salvarCadastro(){
  var nome = document.getElementById('f_nome').value.trim();
  var telefone = document.getElementById('f_telefone').value.trim();
  var renda1 = valorRenda('f_renda1');
  if(!nome || !telefone){ mostrarStatus('⚠️ Preencha ao menos nome e telefone.', 'erro'); return; }
  if(!renda1){ mostrarStatus('⚠️ Preencha a renda do titular.', 'erro'); return; }

  var renda2 = document.getElementById('f_temConjuge').checked ? valorRenda('f_renda2') : 0;

  var dados = {
    nome: nome,
    telefone: telefone,
    cpf: document.getElementById('f_cpf').value.trim(),
    nascimento: document.getElementById('f_nascimento').value,
    profissao: document.getElementById('f_profissao').value.trim(),
    civil: document.getElementById('f_civil').value,
    rua: document.getElementById('f_rua').value.trim(),
    bairro: document.getElementById('f_bairro').value.trim(),
    cep: document.getElementById('f_cep').value.trim(),
    cidade: document.getElementById('f_cidade').value.trim(),
    uf: document.getElementById('f_uf').value,
    imovel: document.getElementById('f_imovel').value,
    dependente: document.getElementById('f_dependente').value,
    dependenteRenda: document.getElementById('f_dependenteRenda').value,
    fgts: document.getElementById('f_fgts').value,
    rendaTitular: renda1,
    rendaConjuge: renda2,
    rendaTotal: renda1+renda2,
    temTerreno: document.getElementById('f_temTerreno').value,
    tLote: document.getElementById('f_tLote').value.trim(),
    tQuadra: document.getElementById('f_tQuadra').value.trim(),
    tArea: document.getElementById('f_tArea').value,
    tRua: document.getElementById('f_tRua').value.trim(),
    tBairro: document.getElementById('f_tBairro').value.trim(),
    tCep: document.getElementById('f_tCep').value.trim(),
    tCidade: document.getElementById('f_tCidade').value.trim(),
    atendente: document.getElementById('f_atendente').value.trim(),
    status: 'pendente',
    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection('evento_precadastros').doc().set(dados).then(function(){
    totalSalvos++;
    document.getElementById('contador').textContent = totalSalvos+' cadastro(s) enviado(s) nessa sessão';
    mostrarStatus('✅ '+nome+' cadastrado(a)! Pode atender a próxima pessoa.', 'ok');
    // limpa o formulário, mantém o nome do atendente e a cidade (repetem bastante)
    ['f_nome','f_telefone','f_cpf','f_nascimento','f_profissao','f_rua','f_bairro','f_cep',
     'f_renda1','f_renda2','f_tLote','f_tQuadra','f_tArea','f_tRua','f_tBairro','f_tCep'].forEach(limparCampo);
    document.getElementById('f_civil').value='';
    document.getElementById('f_imovel').value='nao';
    document.getElementById('f_dependente').value='nao';
    document.getElementById('f_fgts').value='sim';
    document.getElementById('f_temConjuge').checked=false;
    document.getElementById('f_temTerreno').value='nao';
    document.getElementById('boxConjuge').style.display='none';
    document.getElementById('boxDependenteRenda').style.display='none';
    document.getElementById('boxTerreno').style.display='none';
    atualizarTotal();
    document.getElementById('f_nome').focus();
  }).catch(function(err){
    mostrarStatus('❌ Erro ao salvar: '+err.message, 'erro');
  });
}
</script>
</body>
</html>
