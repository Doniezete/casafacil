<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Casa Fácil — Cartões do Evento</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0f1420;--card:#161d2e;--bd:#2a3454;--ac:#f59e0b;--ac2:#f97316;
  --tx:#eef1f8;--tx2:#e2e8f2;--mut:#8b94ad;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);padding:16px}
.wrap{max-width:640px;margin:0 auto}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--ac);margin-bottom:2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;font-weight:600;cursor:pointer}
.btn.ac{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a1206;border:none}
.lista-item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lista-item .nome{font-weight:700}
.lista-item .info{color:var(--mut);font-size:12px;margin-top:2px}
.tag-usado{font-size:11px;color:#4ade80;border:1px solid #1f5c3a;border-radius:999px;padding:2px 8px}

#overlayCartao{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlayCartao.show{display:flex}

/* CARTÃO — versão compacta, tamanho de cartão de visita (8,5cm x 5,5cm) */
.cartao{width:8.5cm;height:5.5cm;background:linear-gradient(135deg,#1a2340,#0c0f1a);border:2px solid var(--ac);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden;display:flex;padding:0.45cm;box-sizing:border-box;position:relative}
.cartao-esq{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-right:0.3cm;min-width:0}
.cartao .logoCard{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--ac)}
.cartao .ribbon-lote{display:inline-block;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#1a1206;font-family:'Syne',sans-serif;font-weight:800;font-size:8px;padding:3px 8px;border-radius:999px;margin-top:5px}
.cartao .nomeCliente{font-family:'Syne',sans-serif;font-size:12px;font-weight:800;color:#fff;margin-top:6px;overflow-wrap:break-word}
.cartao .pontos-rotulo{font-size:8px;color:var(--mut);margin-top:4px}
.cartao .pontos-valor{font-family:'Syne',sans-serif;font-size:18px;color:var(--ac);font-weight:800}
.cartao .oferta-mini{font-size:7px;color:#f87171;font-weight:600;line-height:1.4;margin-top:4px}
.cartao .oferta-mini b{font-size:9px;font-weight:800}
.cartao .indicacao-mini{font-size:8px;color:#4ade80;font-weight:700;line-height:1.35;margin-top:4px}
.cartao .rodape-mini{font-size:7px;color:var(--mut);margin-top:4px}
.cartao-dir{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border-radius:10px;padding:6px;width:2.6cm;flex-shrink:0}
.cartao-dir img{width:2.1cm;height:2.1cm;display:block}
.cartao-dir .legenda-qr{font-size:7px;color:#1a1206;font-weight:700;text-align:center;margin-top:3px}
.fechar-cartao{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer;z-index:2}
.acoes-cartao{display:flex;gap:8px;margin-top:16px;justify-content:center}

@media print{
  body *{visibility:hidden}
  #overlayCartao, #overlayCartao *{visibility:visible}
  #overlayCartao{position:absolute;top:0;left:0;right:auto;bottom:auto;background:#fff;padding:0;align-items:flex-start;justify-content:flex-start}
  .cartao{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fechar-cartao,.acoes-cartao{display:none}
  @page{margin:0.5cm}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">CASA FÁCIL</div>
  <div class="sub">Cartões de bônus — Evento Jardim Ranzani</div>
  <button class="btn" onclick="carregarLista()" style="margin-bottom:14px">🔁 Atualizar lista</button>
  <div id="lista"></div>
</div>

<div id="overlayCartao">
  <div class="cartao" id="cartaoConteudo">
    <button class="fechar-cartao" onclick="fecharCartao()">×</button>

    <div class="cartao-esq">
      <div>
        <div class="logoCard">CASA FÁCIL</div>
        <div class="ribbon-lote">🏆 JARDIM RANZANI</div>
        <div class="nomeCliente" id="cartaoNome">Nome</div>
      </div>
      <div>
        <div class="pontos-rotulo">Fechando com a gente, você garante</div>
        <div class="pontos-valor">+50 pontos</div>
        <div class="oferta-mini">🔥 <b>Projeto grátis</b> fechando hoje. Até 7 dias: 50% off.</div>
      </div>
      <div>
        <div class="indicacao-mini">🎁 Indique um amigo e ganhem bônus</div>
        <div class="rodape-mini">(19) 99594-8982 · válido por 1 mês</div>
      </div>
    </div>

    <div class="cartao-dir">
      <div id="cartaoQR"></div>
      <div class="legenda-qr">Escaneie</div>
    </div>

    <div class="acoes-cartao">
      <button class="btn ac" onclick="window.print()">🖨️ Imprimir</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBZGILaMIHssrQaQz_ZTLH0ilWV1_kkMi0",
  authDomain: "casa-facil-4aef8.firebaseapp.com",
  projectId: "casa-facil-4aef8",
  storageBucket: "casa-facil-4aef8.firebasestorage.app",
  messagingSenderId: "244246614237",
  appId: "1:244246614237:web:45cc6e0db81559aed7cb34"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// URL base do mini-site do evento — cada cartão ganha um link personalizado
// (?ref=nome), pra que, se essa pessoa mostrar o cartão pra um amigo, o amigo
// já chegue no site sabendo quem indicou.
const SITE_BASE = "https://doniezete.github.io/casafacil/evento-site.html";

function carregarLista(){
  document.getElementById('lista').innerHTML = '<div style="color:var(--mut);font-size:13px">Carregando...</div>';
  db.collection('evento_precadastros').orderBy('criadoEm','desc').limit(100).get().then(function(snap){
    var html = '';
    snap.forEach(function(doc){
      var d = doc.data();
      html += '<div class="lista-item">'
        + '<div><div class="nome">'+esc(d.nome||'sem nome')+'</div><div class="info">'+esc(d.telefone||'')+'</div></div>'
        + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        +   (d.status==='usado' ? '<span class="tag-usado">📋 atendido no simulador</span>' : '<span style="font-size:11px;color:var(--mut);border:1px solid var(--bd);border-radius:999px;padding:2px 8px">⏳ pendente</span>')
        +   (d.cartaoImpresso ? '<span class="tag-usado">🎁 cartão gerado</span>' : '')
        +   '<button class="btn ac" onclick="abrirCartao(\''+doc.id+'\',\''+esc(d.nome||'').replace(/'/g,"\\'")+'\')">🎁 Gerar cartão</button>'
        + '</div>'
        + '</div>';
    });
    document.getElementById('lista').innerHTML = html || '<div style="color:var(--mut);font-size:13px">Nenhum cadastro ainda.</div>';
  }).catch(function(err){
    document.getElementById('lista').innerHTML = '<div style="color:#f87171;font-size:13px">Erro: '+err.message+'</div>';
  });
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function abrirCartao(id, nome){
  document.getElementById('cartaoNome').textContent = nome || 'Cliente';
  document.getElementById('overlayCartao').classList.add('show');

  var linkPersonalizado = SITE_BASE + '?ref=' + encodeURIComponent(nome || '');
  var qrBox = document.getElementById('cartaoQR');
  // Gera o QR direto como imagem pronta (sem depender de nenhuma biblioteca de JS
  // que possa ser bloqueada pela proteção de rastreamento de alguns navegadores).
  var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=8&data=' + encodeURIComponent(linkPersonalizado);
  qrBox.innerHTML = '<img src="'+qrUrl+'" width="150" height="150" alt="QR code" style="display:block;margin:0 auto;border-radius:6px"/>';

  // marca como cartão já gerado, pra facilitar controle de quem já recebeu
  db.collection('evento_precadastros').doc(id).set({cartaoImpresso:true}, {merge:true}).then(carregarLista);
}
function fecharCartao(){
  document.getElementById('overlayCartao').classList.remove('show');
}

carregarLista();
</script>
</body>
</html>
